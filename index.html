<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pnake - Final Version</title>
    <style>
        :root { --neon: #ff007f; --bg: #1a1a2e; --panel: #16213e; }
        * { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 500px; height: 100vh; position: relative; display: flex; flex-direction: column; border: 2px solid var(--neon); }
        .screen { display: none; flex-direction: column; align-items: center; padding: 20px; flex-grow: 1; overflow-y: auto; width: 100%; }
        .active { display: flex; }
        h1 { color: var(--neon); text-shadow: 0 0 15px var(--neon); font-size: 3rem; margin: 20px 0; }
        .currency { color: #ffd700; font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        button { background: var(--panel); color: white; border: 2px solid var(--neon); padding: 15px; margin: 8px; width: 85%; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        button:active { background: var(--neon); }
        input { padding: 15px; margin: 10px; width: 85%; background: #0f3460; border: 1px solid var(--neon); color: white; border-radius: 8px; }
        canvas { background: black; width: 90vw; height: 90vw; max-width: 360px; max-height: 360px; border: 2px solid var(--neon); }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 90%; margin-top: 15px; }
        .c-btn { background: rgba(255,0,127,0.1); border: 1px solid var(--neon); height: 70px; display: flex; justify-content: center; align-items: center; font-size: 2rem; border-radius: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid var(--neon); padding: 8px; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>
<div id="app">
    <div id="scr-auth" class="screen active">
        <h1>PNAKE</h1>
        <input type="text" id="login" placeholder="Логин">
        <input type="password" id="pass" placeholder="Пароль">
        <button id="auth-login-btn">ВОЙТИ</button>
        <button id="auth-reg-btn" style="border-color: #555; font-size: 0.9rem;">Регистрация</button>
    </div>

    <div id="scr-menu" class="screen">
        <div class="currency">💰 Зменеты: <span id="u-coins">0</span></div>
        <h2 id="u-name">Игрок</h2>
        <button id="menu-start-btn" style="height: 80px; background: var(--neon);">ИГРАТЬ</button>
        <button id="menu-top-btn">РЕКОРДЫ</button>
        <button onclick="location.reload()">ВЫХОД</button>
    </div>

    <div id="scr-top" class="screen">
        <h2>МИРОВОЙ ТОП</h2>
        <table>
            <thead><tr><th>#</th><th>Игрок</th><th>Очки</th></tr></thead>
            <tbody id="top-list"></tbody>
        </table>
        <button onclick="window.showScreen('scr-menu')">НАЗАД</button>
    </div>

    <div id="scr-game" class="screen">
        <div style="display:flex; justify-content:space-between; width:100%; padding:5px;">
            <span>Счет: <b id="score">0</b></span>
            <button onclick="location.reload()" style="width:auto; margin:0; padding:5px; background:red;">🛑</button>
        </div>
        <canvas id="canvas" width="400" height="400"></canvas>
        <div class="controls">
            <div></div><div class="c-btn" id="up-btn">▲</div><div></div>
            <div class="c-btn" id="left-btn">◀</div><div class="c-btn" id="down-btn">▼</div><div class="c-btn" id="right-btn">▶</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDy-KwcsKCk1rSQtSpB6dCry-F1v8mxRNg",
        authDomain: "pnake-5a242.firebaseapp.com",
        databaseURL: "https://pnake-5a242-default-rtdb.firebaseio.com",
        projectId: "pnake-5a242",
        storageBucket: "pnake-5a242.firebasestorage.app",
        messagingSenderId: "961270080510",
        appId: "1:961270080510:web:440ca3fe3f8cdba78396af"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;
    let gameInt = null;
    let state = { s: [], d: 'right', nD: 'right', f: {x:5, y:5}, sc: 0 };
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');

    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'scr-menu') updateMenuUI();
    };

    function updateMenuUI() {
        let users = JSON.parse(localStorage.getItem('pnake_users') || '{}');
        let u = users[currentUser];
        if(u) {
            document.getElementById('u-coins').innerText = u.coins;
            document.getElementById('u-name').innerText = currentUser;
        }
    }

    // Регистрация
    document.getElementById('auth-reg-btn').onclick = () => {
        const l = document.getElementById('login').value.trim();
        const p = document.getElementById('pass').value.trim();
        if(!l || !p) return alert("Заполни поля!");
        let users = JSON.parse(localStorage.getItem('pnake_users') || '{}');
        if(users[l]) return alert("Ник занят");
        users[l] = { pass: p, coins: 0 };
        localStorage.setItem('pnake_users', JSON.stringify(users));
        alert("Успешно!");
    };

    // Вход
    document.getElementById('auth-login-btn').onclick = () => {
        const l = document.getElementById('login').value.trim();
        const p = document.getElementById('pass').value.trim();
        let users = JSON.parse(localStorage.getItem('pnake_users') || '{}');
        if(users[l] && users[l].pass === p) {
            currentUser = l;
            window.showScreen('scr-menu');
        } else alert("Ошибка входа!");
    };

    // ТОП игроков
    document.getElementById('menu-top-btn').onclick = () => {
        window.showScreen('scr-top');
        const list = document.getElementById('top-list');
        list.innerHTML = "<tr><td colspan='3'>Загрузка...</td></tr>";

        try {
            const q = query(ref(db, 'leaderboard'), orderByChild('score'), limitToLast(10));
            onValue(q, (snap) => {
                let data = [];
                snap.forEach(c => { data.push(c.val()); });
                data.sort((a,b) => b.score - a.score);
                list.innerHTML = data.length ? data.map((v, i) => `<tr><td>${i+1}</td><td>${v.name}</td><td>${v.score}</td></tr>`).join('') : "<tr><td colspan='3'>Нет рекордов</td></tr>";
            }, { onlyOnce: true });
        } catch(e) { list.innerHTML = "<tr><td colspan='3'>Ошибка связи</td></tr>"; }
    };

    // Игра
    document.getElementById('menu-start-btn').onclick = () => {
        window.showScreen('scr-game');
        state = { s: [{x:10, y:10}], d: 'right', nD: 'right', f: {x:5, y:5}, sc: 0 };
        if(gameInt) clearInterval(gameInt);
        gameInt = setInterval(loop, 140);
    };

    const setD = (d) => {
        const opp = {up:'down', down:'up', left:'right', right:'left'};
        if(d !== opp[state.d]) state.nD = d;
    };

    document.getElementById('up-btn').onclick = () => setD('up');
    document.getElementById('down-btn').onclick = () => setD('down');
    document.getElementById('left-btn').onclick = () => setD('left');
    document.getElementById('right-btn').onclick = () => setD('right');

    function loop() {
        state.d = state.nD;
        let h = {...state.s[0]};
        if(state.d === 'up') h.y--; if(state.d === 'down') h.y++;
        if(state.d === 'left') h.x--; if(state.d === 'right') h.x++;

        if(h.x<0 || h.x>=20 || h.y<0 || h.y>=20 || state.s.find(p=>p.x==h.x && p.y==h.y)) {
            clearInterval(gameInt);
            alert("Конец! Счет: " + state.sc);
            let users = JSON.parse(localStorage.getItem('pnake_users') || '{}');
            users[currentUser].coins += state.sc;
            localStorage.setItem('pnake_users', JSON.stringify(users));
            push(ref(db, 'leaderboard'), { name: currentUser, score: state.sc });
            window.showScreen('scr-menu');
            return;
        }

        state.s.unshift(h);
        if(h.x==state.f.x && h.y==state.f.y) {
            state.sc++;
            document.getElementById('score').innerText = state.sc;
            state.f = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)};
        } else state.s.pop();

        ctx.clearRect(0,0,400,400);
        ctx.fillStyle = "red"; ctx.fillRect(state.f.x*20+2, state.f.y*20+2, 16, 16);
        ctx.fillStyle = "#ff007f"; state.s.forEach(p => ctx.fillRect(p.x*20+1, p.y*20+1, 18, 18));
    }
</script>
</body>
</html>
