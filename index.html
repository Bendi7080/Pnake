<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pnake - Fullscreen Edition</title>
    <style>
        :root {
            --neon-pink: #ff007f;
            --dark-bg: #1a1a2e;
            --btn-bg: #16213e;
            --text-gold: #ffd700;
        }

        * { touch-action: manipulation; box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #app-container {
            width: 100%; max-width: 500px;
            height: 100%; max-height: 900px;
            background: var(--dark-bg);
            position: relative;
            display: flex; flex-direction: column;
            border: 2px solid var(--neon-pink);
        }

        .screen {
            display: none; flex-direction: column;
            align-items: center; padding: 20px;
            flex-grow: 1; width: 100%;
        }

        .active { display: flex; }

        h1 { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); font-size: 4rem; margin: 40px 0; }

        button {
            background: var(--btn-bg); color: white;
            border: 2px solid var(--neon-pink);
            padding: 15px; margin: 10px;
            cursor: pointer; width: 80%;
            font-size: 1.2rem; border-radius: 10px;
            transition: 0.2s;
        }

        input {
            padding: 15px; margin: 10px; width: 80%;
            background: #0f3460; border: 1px solid var(--neon-pink);
            color: white; border-radius: 8px;
        }

        .settings-icon {
            position: absolute; top: 15px; right: 15px;
            font-size: 30px; cursor: pointer; z-index: 100;
        }

        /* ИГРОВАЯ ЗОНА */
        #game-wrapper {
            position: relative; width: 100%;
            display: flex; flex-direction: column; align-items: center;
        }

        canvas {
            background: black; border: 5px solid black;
            width: 90vw; height: 90vw; max-width: 380px; max-height: 380px;
        }

        /* УПРАВЛЕНИЕ (ДЖОЙСТИК) */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 80px);
            gap: 10px; width: 90%; margin-top: 20px;
        }

        .ctrl-btn {
            background: rgba(255, 0, 127, 0.2);
            border: 2px solid var(--neon-pink);
            border-radius: 15px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; color: white;
            user-select: none;
        }

        .ctrl-btn:active { background: var(--neon-pink); }

        .shop-item {
            width: 100%; display: flex; justify-content: space-between;
            align-items: center; background: rgba(255,255,255,0.05);
            padding: 12px; margin: 5px 0; border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="settings-trigger" class="settings-icon" onclick="showScreen('screen-settings')">⚙️</div>

    <div id="screen-auth" class="screen active">
        <h1>PNAKE</h1>
        <input type="text" id="auth-login" placeholder="Логин">
        <input type="password" id="auth-pass" placeholder="Пароль">
        <button onclick="handleLogin()">ВОЙТИ</button>
        <button onclick="handleRegister()" style="border-color: #555; font-size: 0.9rem;">Регистрация</button>
    </div>

    <div id="screen-menu" class="screen">
        <div style="color: gold; font-size: 1.5rem; margin-top: 20px;">💰 <span id="user-coins">0</span></div>
        <h2 id="welcome-text">Приятной игры!</h2>
        <button onclick="startGame()" style="height: 120px; font-weight: bold; background: var(--neon-pink);">ИГРАТЬ</button>
        <button onclick="showScreen('screen-shop')">МАГАЗИН</button>
        <button onclick="showScreen('screen-auth')" style="margin-top: auto; opacity: 0.6;">Выход</button>
    </div>

    <div id="screen-settings" class="screen">
        <h2>Настройки</h2>
        <button onclick="toggleSetting('music')">Музыка: <span id="set-music">ВКЛ</span></button>
        <button onclick="toggleTheme()">Режим: <span id="set-theme">НОЧЬ</span></button>
        <button onclick="showScreen('screen-menu')">Назад</button>
    </div>

    <div id="screen-shop" class="screen">
        <h3>Магазин</h3>
        <div style="display: flex; gap: 5px; margin-bottom: 15px;">
            <button onclick="renderShop('colors')" style="font-size: 0.7rem; padding: 10px;">ЦВЕТА</button>
            <button onclick="renderShop('food')" style="font-size: 0.7rem; padding: 10px;">ЕДА</button>
            <button onclick="renderShop('shapes')" style="font-size: 0.7rem; padding: 10px;">ФОРМЫ</button>
        </div>
        <div id="shop-content" style="width: 100%; overflow-y: auto; max-height: 300px;"></div>
        <button onclick="showScreen('screen-menu')" style="margin-top: auto;">Назад</button>
    </div>

    <div id="screen-game" class="screen" style="padding: 10px;">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-size: 1.5rem;">🍎: <span id="game-score">0</span></span>
            <button onclick="pauseGame()" style="width: 60px; margin: 0; background: red; border: none;">🛑</button>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <div></div><div class="ctrl-btn" onclick="setDir('up')">▲</div><div></div>
            <div class="ctrl-btn" onclick="setDir('left')">◀</div>
            <div class="ctrl-btn" onclick="setDir('down')">▼</div>
            <div class="ctrl-btn" onclick="setDir('right')">▶</div>
        </div>
    </div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('pnake_users') || '{}');
    let currentUser = null;
    let gameInterval = null;
    let gameState = { snake: [], dir: 'right', nextDir: 'right', food: {x: 0, y: 0}, score: 0 };

    const shopData = {
        colors: [{id: 'pink', p: 0, n: 'Розовый'}, {id: 'white', p: 50, n: 'Белый'}, {id: 'black', p: 100, n: 'Черный'}],
        food: [{id: 'apple', p: 0, n: 'Яблоко'}, {id: 'strawberry', p: 50, n: 'Клубника'}, {id: 'cupcake', p: 100, n: 'Кекс'}],
        shapes: [{id: 'square', p: 0, n: 'Квадрат'}, {id: 'circle', p: 100, n: 'Круг'}, {id: 'connected', p: 200, n: 'Слитная'}]
    };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('settings-trigger').style.display = (id === 'screen-menu') ? 'block' : 'none';
        if(id === 'screen-menu') updateUI();
    }

    function handleRegister() {
        const l = document.getElementById('auth-login').value;
        const p = document.getElementById('auth-pass').value;
        if(!l || !p) return alert('Введите данные!');
        if(users[l]) return alert('Логин занят!');
        users[l] = { pass: p, coins: 0, inv: {colors:['pink'], food:['apple'], shapes:['square']}, sel: {color:'pink', food:'apple', shape:'square'}, set: {music:true, theme:'night'}};
        localStorage.setItem('pnake_users', JSON.stringify(users));
        alert('Зарегистрировано!');
    }

    function handleLogin() {
        const l = document.getElementById('auth-login').value;
        const p = document.getElementById('auth-pass').value;
        if(users[l] && users[l].pass === p) { currentUser = l; showScreen('screen-menu'); }
        else alert('Неверно!');
    }

    function updateUI() {
        const u = users[currentUser];
        document.getElementById('user-coins').innerText = u.coins;
        document.getElementById('set-theme').innerText = u.set.theme === 'night' ? "НОЧЬ" : "ДЕНЬ";
    }

    function renderShop(cat) {
        const u = users[currentUser];
        let html = '';
        shopData[cat].forEach(item => {
            const owned = u.inv[cat].includes(item.id);
            const selected = u.sel[cat] === item.id;
            let btn = selected ? '<span>Выбрано</span>' : (owned ? `<button onclick="selectItem('${cat}','${item.id}')">Выбрать</button>` : `<button onclick="buyItem('${cat}','${item.id}',${item.p})">${item.p}</button>`);
            html += `<div class="shop-item"><span>${item.n}</span> ${btn}</div>`;
        });
        document.getElementById('shop-content').innerHTML = html;
    }

    function buyItem(cat, id, p) {
        if(users[currentUser].coins >= p) {
            users[currentUser].coins -= p;
            users[currentUser].inv[cat].push(id);
            localStorage.setItem('pnake_users', JSON.stringify(users));
            renderShop(cat); updateUI();
        }
    }

    function selectItem(cat, id) {
        users[currentUser].sel[cat] = id;
        localStorage.setItem('pnake_users', JSON.stringify(users));
        renderShop(cat);
    }

    function toggleTheme() {
        users[currentUser].set.theme = users[currentUser].set.theme === 'night' ? 'day' : 'night';
        document.getElementById('app-container').style.background = users[currentUser].set.theme === 'day' ? '#fff' : '#1a1a2e';
        document.getElementById('app-container').style.color = users[currentUser].set.theme === 'day' ? '#000' : '#fff';
        updateUI();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function startGame() {
        showScreen('screen-game');
        gameState = { snake: [{x: 10, y: 10}], dir: 'right', nextDir: 'right', food: {x: 15, y: 10}, score: 0 };
        document.getElementById('game-score').innerText = "0";
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameStep, 130);
    }

    function setDir(d) {
        const opposites = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
        if (d !== opposites[gameState.dir]) gameState.nextDir = d;
    }

    function pauseGame() {
        clearInterval(gameInterval);
        if(confirm("Выйти в меню?")) showScreen('screen-menu');
        else gameInterval = setInterval(gameStep, 130);
    }

    function gameStep() {
        gameState.dir = gameState.nextDir;
        let head = {...gameState.snake[0]};
        if(gameState.dir === 'up') head.y--;
        if(gameState.dir === 'down') head.y++;
        if(gameState.dir === 'left') head.x--;
        if(gameState.dir === 'right') head.x++;

        if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || gameState.snake.some(s => s.x === head.x && s.y === head.y)) {
            alert("Игра окончена!");
            users[currentUser].coins += gameState.score;
            localStorage.setItem('pnake_users', JSON.stringify(users));
            clearInterval(gameInterval);
            showScreen('screen-menu');
            return;
        }

        gameState.snake.unshift(head);
        if(head.x === gameState.food.x && head.y === gameState.food.y) {
            gameState.score++;
            document.getElementById('game-score').innerText = gameState.score;
            gameState.food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            if(gameState.score % 10 === 0) {
                let c = ["#FFB3BA", "#BAFFC9", "#BAE1FF"][Math.floor(Math.random()*3)];
                canvas.style.backgroundColor = c;
            }
        } else {
            gameState.snake.pop();
        }
        draw();
    }

    function draw() {
        ctx.clearRect(0,0,400,400);
        const u = users[currentUser];
        // Еда
        ctx.fillStyle = u.sel.food === 'apple' ? 'red' : (u.sel.food === 'strawberry' ? '#fc5a8d' : '#f2b552');
        ctx.beginPath(); ctx.arc(gameState.food.x*20+10, gameState.food.y*20+10, 8, 0, Math.PI*2); ctx.fill();
        // Змейка
        ctx.fillStyle = u.sel.color === 'pink' ? '#ff007f' : (u.sel.color === 'black' ? '#333' : '#fff');
        gameState.snake.forEach(s => {
            if(u.sel.shape === 'circle') { ctx.beginPath(); ctx.arc(s.x*20+10, s.y*20+10, 9, 0, Math.PI*2); ctx.fill(); }
            else { ctx.fillRect(s.x*20+1, s.y*20+1, 18, 18); }
        });
    }

    window.addEventListener('keydown', e => {
        if(e.key === 'ArrowUp') setDir('up');
        if(e.key === 'ArrowDown') setDir('down');
        if(e.key === 'ArrowLeft') setDir('left');
        if(e.key === 'ArrowRight') setDir('right');
    });
</script>
</body>
</html>
