<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pnake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #FFF0F5;
            font-family: 'Fredoka One', cursive;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            background-color: #FFF0F5;
        }

        /* UI слой */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .score-board {
            font-size: 22px;
            color: #FF69B4;
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #FFC0CB;
        }

        .settings-btn {
            font-size: 24px;
            background: #FFF;
            border: 2px solid #FF69B4;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #FF69B4;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Магазин */
        #shop-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 240, 245, 0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            overflow-y: auto;
            z-index: 100;
        }

        .back-arrow {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 28px;
            color: #FF69B4;
            cursor: pointer;
            background: #FFF;
            border: 3px solid #FF69B4;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2 { color: #FF69B4; text-shadow: 1px 1px #FFF; margin-bottom: 10px; }

        .shop-section {
            width: 90%;
            max-width: 400px;
            background: #FFF;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #FFC0CB;
            box-sizing: border-box;
        }

        .section-title { color: #FF69B4; text-align: center; margin-bottom: 10px; font-size: 18px; }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .shop-item {
            aspect-ratio: 1;
            border-radius: 12px;
            background: #FDFDFD;
            border: 2px solid #EEE;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .shop-item.selected { border-color: #FF69B4; background: #FFF0F5; }
        .shop-item.locked { opacity: 0.7; }

        .rarity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        .basic { background: #A0A0A0; }
        .rare { background: #00BFFF; }
        .epic { background: #9370DB; }
        .legendary { background: #FFD700; }

        .item-preview { font-size: 20px; margin-bottom: 4px; }
        .price-tag { font-size: 10px; color: #777; font-weight: bold; }

    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="header">
            <div class="score-board">🍎 <span id="score">0</span> | 💎 <span id="crystals">0</span></div>
            <div class="settings-btn" onclick="toggleShop()">⚙️</div>
        </div>
    </div>

    <div id="shop-screen">
        <div class="back-arrow" onclick="toggleShop()">←</div>
        <h2>Pnake Shop</h2>

        <div class="shop-section">
            <div class="section-title">Цвета</div>
            <div id="color-grid" class="items-grid"></div>
        </div>

        <div class="shop-section">
            <div class="section-title">Глазки</div>
            <div id="face-grid" class="items-grid"></div>
        </div>

        <div class="shop-section">
            <div class="section-title">Еда</div>
            <div id="food-grid" class="items-grid"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let crystals = 50; 
        let gridSize = 25;
        let tileCountX, tileCountY;
        let isShopOpen = false;

        let snake = [{x: 10, y: 10}];
        let velocity = {x: 0, y: 0};
        let food = {x: 5, y: 5};

        // Настройки стиля
        let snakeColor = '#FF69B4';
        let currentFace = 'normal';
        let currentFoodType = 'apple';

        const shopData = {
            colors: [
                { id: 'pink', color: '#FF69B4', price: 0, rarity: 'basic' },
                { id: 'blue', color: '#87CEEB', price: 20, rarity: 'rare' },
                { id: 'mint', color: '#98FF98', price: 20, rarity: 'rare' },
                { id: 'lavender', color: '#E6E6FA', price: 60, rarity: 'epic' },
                { id: 'gold', color: '#FFD700', price: 200, rarity: 'legendary' }
            ],
            faces: [
                { id: 'normal', price: 0, rarity: 'basic', icon: '●●' },
                { id: 'happy', price: 40, rarity: 'rare', icon: '^^' },
                { id: 'kawaii', price: 100, rarity: 'epic', icon: '◕◕' },
                { id: 'cool', price: 300, rarity: 'legendary', icon: '🕶' }
            ],
            food: [
                { id: 'apple', icon: '🍎', price: 0, rarity: 'basic' },
                { id: 'cherry', icon: '🍒', price: 15, rarity: 'rare' },
                { id: 'peach', icon: '🍑', price: 50, rarity: 'epic' },
                { id: 'burger', icon: '🍔', price: 150, rarity: 'legendary' }
            ]
        };

        let inventory = { colors: ['pink'], faces: ['normal'], food: ['apple'] };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            tileCountX = Math.floor(canvas.width / gridSize);
            tileCountY = Math.floor(canvas.height / gridSize);
        }

        function toggleShop() {
            isShopOpen = !isShopOpen;
            document.getElementById('shop-screen').style.display = isShopOpen ? 'flex' : 'none';
            if(isShopOpen) renderShop();
        }

        function renderShop() {
            renderSection('color-grid', shopData.colors, 'color');
            renderSection('face-grid', shopData.faces, 'face');
            renderSection('food-grid', shopData.food, 'food');
        }

        function renderSection(gridId, items, type) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                const isOwned = inventory[type + 's'] ? inventory[type + 's'].includes(item.id) : inventory[type].includes(item.id);
                const isSelected = (type === 'color' && snakeColor === item.color) || (type === 'face' && currentFace === item.id) || (type === 'food' && currentFoodType === item.id);
                
                div.className = `shop-item ${item.rarity} ${isSelected ? 'selected' : ''} ${!isOwned ? 'locked' : ''}`;
                
                let preview = '';
                if(type === 'color') preview = `<div class="item-preview" style="background:${item.color}; width:20px; height:20px; border-radius:4px;"></div>`;
                else preview = `<div class="item-preview">${item.icon}</div>`;

                div.innerHTML = `
                    <div class="rarity-dot ${item.rarity}"></div>
                    ${preview}
                    <div class="price-tag">${isOwned ? (isSelected ? '✓' : 'Взять') : '💎' + item.price}</div>
                `;

                div.onclick = () => {
                    if(isOwned) {
                        if(type === 'color') snakeColor = item.color;
                        if(type === 'face') currentFace = item.id;
                        if(type === 'food') currentFoodType = item.id;
                    } else if(crystals >= item.price) {
                        crystals -= item.price;
                        inventory[type + (type === 'food' ? '' : 's')].push(item.id);
                        document.getElementById('crystals').innerText = crystals;
                    }
                    renderShop();
                };
                grid.appendChild(div);
            });
        }

        function update() {
            if (isShopOpen || (velocity.x === 0 && velocity.y === 0)) return;

            const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            if(head.x < 0) head.x = tileCountX - 1;
            if(head.x >= tileCountX) head.x = 0;
            if(head.y < 0) head.y = tileCountY - 1;
            if(head.y >= tileCountY) head.y = 0;

            for(let part of snake) {
                if(head.x === part.x && head.y === part.y) return resetGame();
            }

            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                score++;
                crystals += 2;
                document.getElementById('score').innerText = score;
                document.getElementById('crystals').innerText = crystals;
                food = {x: Math.floor(Math.random() * tileCountX), y: Math.floor(Math.random() * tileCountY)};
            } else {
                snake.pop();
            }
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            velocity = {x: 0, y: 0};
            score = 0;
            document.getElementById('score').innerText = score;
        }

        function draw() {
            ctx.fillStyle = '#FFF0F5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Еда
            const foodObj = shopData.food.find(f => f.id === currentFoodType);
            ctx.font = "20px Arial";
            ctx.fillText(foodObj.icon, food.x * gridSize + 2, food.y * gridSize + 20);

            // Змейка
            snake.forEach((part, i) => {
                ctx.fillStyle = snakeColor;
                ctx.beginPath();
                ctx.roundRect(part.x * gridSize, part.y * gridSize, gridSize - 1, gridSize - 1, i === 0 ? 8 : 4);
                ctx.fill();

                if(i === 0) drawFace(part.x * gridSize, part.y * gridSize);
            });
        }

        function drawFace(x, y) {
            ctx.fillStyle = '#000';
            if(currentFace === 'normal') {
                ctx.fillRect(x + 5, y + 6, 3, 3);
                ctx.fillRect(x + 16, y + 6, 3, 3);
            } else if(currentFace === 'happy') {
                ctx.font = "bold 12px Arial";
                ctx.fillText("^", x + 4, y + 12);
                ctx.fillText("^", x + 15, y + 12);
            } else if(currentFace === 'kawaii') {
                ctx.beginPath();
                ctx.arc(x + 7, y + 10, 3, 0, Math.PI*2);
                ctx.arc(x + 18, y + 10, 3, 0, Math.PI*2);
                ctx.fill();
            } else if(currentFace === 'cool') {
                ctx.fillStyle = '#000';
                ctx.fillRect(x + 3, y + 8, 19, 5);
            }
        }

        // Управление
        window.addEventListener('keydown', e => {
            if(e.key === 'ArrowUp' && velocity.y === 0) velocity = {x: 0, y: -1};
            if(e.key === 'ArrowDown' && velocity.y === 0) velocity = {x: 0, y: 1};
            if(e.key === 'ArrowLeft' && velocity.x === 0) velocity = {x: -1, y: 0};
            if(e.key === 'ArrowRight' && velocity.x === 0) velocity = {x: 1, y: 0};
        });

        let startX, startY;
        canvas.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
        canvas.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if(Math.abs(dx) > Math.abs(dy)) {
                if(dx > 0 && velocity.x === 0) velocity = {x: 1, y: 0};
                else if(dx < 0 && velocity.x === 0) velocity = {x: -1, y: 0};
            } else {
                if(dy > 0 && velocity.y === 0) velocity = {x: 0, y: 1};
                else if(dy < 0 && velocity.y === 0) velocity = {x: 0, y: -1};
            }
        });

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        window.addEventListener('resize', resize);
        resize();
        loop();
    </script>
</body>
</html>
