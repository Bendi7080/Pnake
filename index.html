<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pnake Online</title>
    <style>
        :root { --neon: #ff007f; --bg: #1a1a2e; }
        * { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 500px; height: 100vh; position: relative; display: flex; flex-direction: column; border: 2px solid var(--neon); }
        .screen { display: none; flex-direction: column; align-items: center; padding: 20px; flex-grow: 1; overflow-y: auto; }
        .active { display: flex; }
        h1 { color: var(--neon); text-shadow: 0 0 10px var(--neon); font-size: 3.5rem; margin: 20px 0; }
        button { background: #16213e; color: white; border: 2px solid var(--neon); padding: 15px; margin: 10px; width: 80%; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        input { padding: 15px; margin: 10px; width: 80%; background: #0f3460; border: 1px solid var(--neon); color: white; border-radius: 8px; font-size: 1rem; }
        canvas { background: black; width: 90vw; height: 90vw; max-width: 360px; max-height: 360px; border: 3px solid #000; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 90%; margin-top: 15px; }
        .c-btn { background: rgba(255,0,127,0.1); border: 2px solid var(--neon); height: 75px; display: flex; justify-content: center; align-items: center; font-size: 2rem; border-radius: 15px; user-select: none; }
        .c-btn:active { background: var(--neon); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(255,255,255,0.05); }
        th, td { border: 1px solid var(--neon); padding: 10px; text-align: center; }
        th { background: var(--neon); color: white; }
    </style>
</head>
<body>

<div id="app">
    <div id="scr-auth" class="screen active">
        <h1>PNAKE</h1>
        <input type="text" id="login" placeholder="Твой ник (на англ.)" maxlength="12">
        <button id="btn-play">ИГРАТЬ</button>
        <button id="btn-show-top" style="font-size: 0.9rem; border-color: #555;">Мировой ТОП</button>
    </div>

    <div id="scr-game" class="screen">
        <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:10px; font-size: 1.2rem;">
            <span>Очки: <b id="score">0</b></span>
            <span id="game-user" style="color:var(--neon)"></span>
        </div>
        <canvas id="canvas" width="400" height="400"></canvas>
        <div class="controls">
            <div></div><div class="c-btn" id="ctrl-up">▲</div><div></div>
            <div class="c-btn" id="ctrl-left">◀</div><div class="c-btn" id="ctrl-down">▼</div><div class="c-btn" id="ctrl-right">▶</div>
        </div>
    </div>

    <div id="scr-top" class="screen">
        <h2>ТОП-10 МИРА</h2>
        <table>
            <thead><tr><th>#</th><th>Игрок</th><th>Очки</th></tr></thead>
            <tbody id="top-list"></tbody>
        </table>
        <button onclick="location.reload()">НАЗАД</button>
    </div>
</div>

<script type="module">
    // --- ПОДКЛЮЧЕНИЕ FIREBASE ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    // ВСТАВЬ СВОИ ДАННЫЕ ТУТ:
    const firebaseConfig = {
        apiKey: "AIzaSyDy-KwcsKCk1rSQtSpB6dCry-F1v8mxRNg",
        authDomain: "pnake-5a242.firebaseapp.com",
        databaseURL: "https://pnake-5a242-default-rtdb.firebaseio.com", 
        projectId: "pnake-5a242",
        storageBucket: "pnake-5a242.firebasestorage.app",
        messagingSenderId: "961270080510",
        appId: "1:961270080510:web:440ca3fe3f8cdba78396af"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- ЛОГИКА ИГРЫ ---
    let user = "";
    let gameInt;
    let state = { s: [], d: 'r', nD: 'r', f: {x:10, y:10}, sc: 0 };
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Старт игры
    document.getElementById('btn-play').onclick = () => {
        user = document.getElementById('login').value.trim() || "Аноним";
        document.getElementById('game-user').innerText = user;
        show('scr-game');
        resetGame();
    };

    function resetGame() {
        state = { s: [{x:10, y:10}, {x:9, y:10}], d: 'right', nD: 'right', f: {x:5, y:5}, sc: 0 };
        document.getElementById('score').innerText = "0";
        if(gameInt) clearInterval(gameInt);
        gameInt = setInterval(step, 140);
    }

    function step() {
        state.d = state.nD;
        let head = {...state.s[0]};
        if(state.d === 'up') head.y--;
        if(state.d === 'down') head.y++;
        if(state.d === 'left') head.x--;
        if(state.d === 'right') head.x++;

        // Проверка столкновений
        if(head.x<0 || head.x>=20 || head.y<0 || head.y>=20 || state.s.find(p=>p.x==head.x && p.y==head.y)) {
            gameOver();
            return;
        }

        state.s.unshift(head);
        if(head.x == state.f.x && head.y == state.f.y) {
            state.sc++;
            document.getElementById('score').innerText = state.sc;
            spawnFood();
        } else {
            state.s.pop();
        }
        draw();
    }

    function spawnFood() {
        state.f = { x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20) };
    }

    function draw() {
        ctx.clearRect(0,0,400,400);
        // Еда
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(state.f.x*20+10, state.f.y*20+10, 8, 0, Math.PI*2);
        ctx.fill();
        // Змейка
        ctx.fillStyle = "#ff007f";
        state.s.forEach((p, i) => {
            ctx.shadowBlur = i === 0 ? 10 : 0;
            ctx.shadowColor = "#ff007f";
            ctx.fillRect(p.x*20+1, p.y*20+1, 18, 18);
        });
    }

    function gameOver() {
        clearInterval(gameInt);
        alert("Конец игры! Твой счет: " + state.sc);
        if(state.sc > 0) {
            push(ref(db, 'leaderboard'), { name: user, score: state.sc, t: Date.now() });
        }
        location.reload();
    }

    // Управление
    const setD = (dir) => {
        const opp = {up:'down', down:'up', left:'right', right:'left'};
        if(dir !== opp[state.d]) state.nD = dir;
    };

    document.getElementById('ctrl-up').onclick = () => setD('up');
    document.getElementById('ctrl-down').onclick = () => setD('down');
    document.getElementById('ctrl-left').onclick = () => setD('left');
    document.getElementById('ctrl-right').onclick = () => setD('right');

    window.onkeydown = (e) => {
        if(e.key == "ArrowUp") setD('up');
        if(e.key == "ArrowDown") setD('down');
        if(e.key == "ArrowLeft") setD('left');
        if(e.key == "ArrowRight") setD('right');
    };

    // Таблица лидеров
    document.getElementById('btn-show-top').onclick = () => {
        show('scr-top');
        const q = query(ref(db, 'leaderboard'), orderByChild('score'), limitToLast(10));
        onValue(q, (s) => {
            let list = [];
            s.forEach(c => { list.push(childData(c)); });
            list.sort((a,b) => b.score - a.score);
            document.getElementById('top-list').innerHTML = list.map((v, i) => 
                `<tr><td>${i+1}</td><td>${v.name}</td><td>${v.score}</td></tr>`
            ).join('');
        });
    };
    function childData(c) { return c.val(); }

</script>
</body>
</html>
