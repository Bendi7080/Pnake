<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pnake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #FFF0F5; /* LavenderBlush - очень светло-розовый */
            font-family: 'Fredoka One', cursive;
            touch-action: none; /* Отключает зум и скролл на мобильных */
            -webkit-user-select: none; /* Safari */
            user-select: none;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
        }

        /* Интерфейс (счет и кнопка настроек) */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .score-board {
            font-size: 24px;
            color: #FF69B4; /* HotPink */
            text-shadow: 2px 2px 0px #FFF;
        }

        /* Кнопка настроек (шестеренка) */
        .settings-btn {
            font-size: 24px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #FF69B4;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #FF69B4;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
            transition: transform 0.2s;
        }
        .settings-btn:active {
            transform: scale(0.9);
        }

        /* Экран Магазина */
        #shop-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 240, 245, 0.98); /* Почти непрозрачный фон */
            display: none; /* Скрыт по умолчанию */
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            pointer-events: auto;
            overflow-y: auto;
            z-index: 100;
        }

        h2 {
            color: #FF69B4;
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #FFF;
        }

        .shop-section {
            width: 90%;
            margin-bottom: 25px;
            background: #FFF;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.3);
            border: 2px solid #FFC0CB;
        }

        .section-title {
            font-size: 20px;
            color: #FF69B4;
            margin-bottom: 10px;
            text-align: center;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
        }

        .shop-item {
            aspect-ratio: 1;
            border-radius: 15px;
            background: #FAFAFA;
            border: 2px solid #EEE;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
        }

        .shop-item:active {
            transform: scale(0.95);
        }

        .shop-item.selected {
            border: 3px solid #FF69B4;
            background: #FFF0F5;
        }

        .shop-item.locked {
            opacity: 0.6;
            filter: grayscale(0.8);
        }

        /* Индикаторы редкости */
        .rarity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        .basic { background: #A0A0A0; } /* Серый */
        .rare { background: #00BFFF; box-shadow: 0 0 5px #00BFFF; } /* Голубой */
        .epic { background: #9370DB; box-shadow: 0 0 5px #9370DB; } /* Фиолетовый */
        .legendary { background: #FFD700; box-shadow: 0 0 8px #FFD700; } /* Золотой */

        .item-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        .price-tag {
            font-size: 12px;
            color: #666;
        }

        /* Красивая розовая стрелка НАЗАД */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 30px;
            color: #FF69B4;
            cursor: pointer;
            background: #FFF;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
            border: 2px solid #FF69B4;
        }
        .back-arrow:active {
            transform: scale(0.9);
        }

        /* Джойстик (если нужен, оставим скрытым для тача по экрану) */
        #joystick-zone {
            display: none; 
        }

        /* Лица (глазки) превью */
        .eye-preview {
            display: flex;
            gap: 2px;
        }
        .eye-dot {
            width: 4px;
            height: 4px;
            background: black;
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="header">
            <div class="score-board">🍎 <span id="score">0</span> | 💎 <span id="crystals">0</span></div>
            <div class="settings-btn" onclick="toggleShop()">⚙️</div>
        </div>
    </div>

    <div id="shop-screen">
        <div class="back-arrow" onclick="toggleShop()">←</div>
        <h2>Магазин</h2>

        <div class="shop-section">
            <div class="section-title">Цвет Змейки</div>
            <div class="items-grid" id="color-grid">
                </div>
        </div>

        <div class="shop-section">
            <div class="section-title">Личико</div>
            <div class="items-grid" id="face-grid">
                </div>
        </div>

        <div class="shop-section">
            <div class="section-title">Вкусняшки</div>
            <div class="items-grid" id="food-grid">
                </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Настройки экрана
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ДАННЫЕ ИГРЫ ---
        let score = 0;
        let crystals = 100; // Стартовый капитал для тестов
        let gameRunning = true;
        let snake = [{x: 10, y: 10}];
        let velocity = {x: 0, y: 0};
        let gridSize = 25; // Размер клетки
        let tileCountX = Math.floor(canvas.width / gridSize);
        let tileCountY = Math.floor(canvas.height / gridSize);

        // Еда
        let food = {x: 5, y: 5};
        let currentFoodType = 'apple'; // 'apple', 'cherry', 'peach', 'burger'

        // Настройки змейки (Визуал)
        let snakeColor = '#FF69B4'; // Розовый по умолчанию
        let currentFace = 'normal'; // 'normal', 'happy', 'cool', 'kawaii'

        // --- БАЗА ДАННЫХ МАГАЗИНА ---
        const shopData = {
            colors: [
                { id: 'pink', name: 'Розовый', color: '#FF69B4', price: 0, rarity: 'basic' },
                { id: 'blue', name: 'Небо', color: '#87CEEB', price: 50, rarity: 'rare' },
                { id: 'mint', name: 'Мята', color: '#98FF98', price: 50, rarity: 'rare' },
                { id: 'lavender', name: 'Лаванда', color: '#E6E6FA', price: 100, rarity: 'epic' },
                { id: 'gold', name: 'Золото', color: '#FFD700', price: 500, rarity: 'legendary' }
            ],
            faces: [
                { id: 'normal', name: 'Обычные', type: 'face', price: 0, rarity: 'basic' },
                { id: 'happy', name: 'Веселые', type: 'face', price: 100, rarity: 'rare' },
                { id: 'kawaii', name: 'Кавай', type: 'face', price: 300, rarity: 'epic' },
                { id: 'cool', name: 'Крутые', type: 'face', price: 1000, rarity: 'legendary' }
            ],
            food: [
                { id: 'apple', name: 'Яблоко', icon: '🍎', price: 0, rarity: 'basic' },
                { id: 'cherry', name: 'Вишня', icon: '🍒', price: 30, rarity: 'rare' },
                { id: 'peach', name: 'Персик', icon: '🍑', price: 80, rarity: 'epic' },
                { id: 'burger', name: 'Бургер', icon: '🍔', price: 200, rarity: 'legendary' }
            ]
        };

        // Состояние покупок (храним ID купленных предметов)
        let inventory = {
            colors: ['pink'],
            faces: ['normal'],
            food: ['apple']
        };

        // --- ЛОГИКА ИГРЫ ---
        
        function gameLoop() {
            if(!isShopOpen) {
                update();
            }
            draw();
            setTimeout(gameLoop, 1000 / 10); // 10 FPS
        }

        function update() {
            // Движение
            const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            // Проход сквозь стены
            if(head.x < 0) head.x = tileCountX - 1;
            if(head.x >= tileCountX) head.x = 0;
            if(head.y < 0) head.y = tileCountY - 1;
            if(head.y >= tileCountY) head.y = 0;

            // Еда
            if(head.x === food.x && head.y === food.y) {
                score++;
                crystals += 2; // Кристаллы за еду
                updateUI();
                spawnFood();
            } else {
                snake.pop(); // Удаляем хвост, если не поели
            }

            // Столкновение с собой
            for(let part of snake) {
                if(head.x === part.x && head.y === part.y && (velocity.x !==0 || velocity.y !==0)) {
                    resetGame();
                    return;
                }
            }

            snake.unshift(head);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCountX);
            food.y = Math.floor(Math.random() * tileCountY);
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            velocity = {x: 0, y: 0};
            score = 0;
            updateUI();
        }

        // --- ОТРИСОВКА ---
        function draw() {
            // Фон
            ctx.fillStyle = '#FFF0F5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Еда
            let foodIcon = shopData.food.find(f => f.id === currentFoodType).icon;
            ctx.font = `${gridSize}px Arial`;
            ctx.fillText(foodIcon, food.x * gridSize, food.y * gridSize + gridSize - 2);

            // Змейка
            for(let i = 0; i < snake.length; i++) {
                let part = snake[i];
                
                // Тело
                ctx.fillStyle = snakeColor;
                
                // Скругляем голову и хвост
                if (i === 0) { // Голова
                    drawHead(part.x, part.y);
                } else { // Тело
                    ctx.beginPath();
                    ctx.roundRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2, 8);
                    ctx.fill();
                }
            }
        }

        function drawHead(x, y) {
            let px = x * gridSize;
            let py = y * gridSize;
            
            ctx.fillStyle = snakeColor;
            ctx.beginPath();
            ctx.roundRect(px, py, gridSize, gridSize, 10);
            ctx.fill();

            // Рисуем ЛИЦО (глазки)
            ctx.fillStyle = 'black'; // Цвет глаз
            
            let eyeOffset = gridSize / 4;
            let eyeSize = 3;

            if (currentFace === 'normal') {
                // Обычные точки
                ctx.beginPath();
                ctx.arc(px + eyeOffset, py + eyeOffset, eyeSize, 0, Math.PI*2);
                ctx.arc(px + gridSize - eyeOffset, py + eyeOffset, eyeSize, 0, Math.PI*2);
                ctx.fill();
            } else if (currentFace === 'happy') {
                // Дуги ^ ^
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#333';
                ctx.beginPath();
                ctx.arc(px + eyeOffset, py + eyeOffset + 2, 4, Math.PI, 0); // Левый
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(px + gridSize - eyeOffset, py + eyeOffset + 2, 4, Math.PI, 0); // Правый
                ctx.stroke();
            } else if (currentFace === 'kawaii') {
                // Большие блестящие глаза
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(px + eyeOffset, py + eyeOffset + 2, 5, 0, Math.PI*2);
                ctx.arc(px + gridSize - eyeOffset, py + eyeOffset + 2, 5, 0, Math.PI*2);
                ctx.fill();
                // Блики
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(px + eyeOffset - 1, py + eyeOffset, 2, 0, Math.PI*2);
                ctx.arc(px + gridSize - eyeOffset - 1, py + eyeOffset, 2, 0, Math.PI*2);
                ctx.fill();
            } else if (currentFace === 'cool') {
                // Очки
                ctx.fillStyle = 'black';
                ctx.fillRect(px + 2, py + eyeOffset - 2, gridSize - 4, 8);
            }
        }

        // --- МАГАЗИН И UI ---
        
        let isShopOpen = false;
        const shopScreen = document.getElementById('shop-screen');
        const scoreEl = document.getElementById('score');
        const crystalsEl = document.getElementById('crystals');

        function updateUI() {
            scoreEl.innerText = score;
            crystalsEl.innerText = crystals;
        }

        function toggleShop() {
            isShopOpen = !isShopOpen;
            if (isShopOpen) {
                shopScreen.style.display = 'flex';
                renderShop();
            } else {
                shopScreen.style.display = 'none';
            }
        }

        function renderShop() {
            // 1. Цвета
            const colorGrid = document.getElementById('color-grid');
            colorGrid.innerHTML = '';
            shopData.colors.forEach(item => {
                createShopItem(item, colorGrid, 'color', item.color);
            });

            // 2. Лица (Глазки)
            const faceGrid = document.getElementById('face-grid');
            faceGrid.innerHTML = '';
            shopData.faces.forEach(item => {
                createShopItem(item, faceGrid, 'face', '#FFF'); // Фон белый для превью
            });

            // 3. Еда
            const foodGrid = document.getElementById('food-grid');
            foodGrid.innerHTML = '';
            shopData.food.forEach(item => {
                createShopItem(item, foodGrid, 'food', '#FFF');
            });
        }

        function createShopItem(item, container, category, bgPreview) {
            const div = document.createElement('div');
            div.className = `shop-item ${item.rarity}`;
            
            // Проверка: куплено или выбрано?
            let isOwned = inventory[category === 'color' ? 'colors' : category === 'face' ? 'faces' : 'food'].includes(item.id);
            let isSelected = (category === 'color' && snakeColor === item.color) ||
                             (category === 'face' && currentFace === item.id) ||
                             (category === 'food' && currentFoodType === item.id);

            if (isSelected) div.classList.add('selected');
            if (!isOwned) div.classList.add('locked');

            // Содержимое
            let previewContent = '';
            if (category === 'color') {
                previewContent = `<div class="item-preview" style="background:${item.color}"></div>`;
            } else if (category === 'food') {
                previewContent = `<div class="item-preview" style="font-size:20px">${item.icon}</div>`;
            } else if (category === 'face') {
                // Превью глаз
                let eyesHTML = '..';
                if(item.id === 'happy') eyesHTML = '^^';
                if(item.id === 'kawaii') eyesHTML = 'OwO';
                if(item.id === 'cool') eyesHTML = 'B|';
                previewContent = `<div class="item-preview" style="color:black; font-weight:bold">${eyesHTML}</div>`;
            }

            let priceHTML = isOwned ? (isSelected ? 'Выбрано' : 'Выбрать') : `💎 ${item.price}`;

            div.innerHTML = `
                <div class="rarity-dot ${item.rarity}"></div>
                ${previewContent}
                <div class="price-tag">${priceHTML}</div>
            `;

            // Клик
            div.onclick = () => {
                if (isOwned) {
                    // Выбираем
                    if (category === 'color') snakeColor = item.color;
                    if (category === 'face') currentFace = item.id;
                    if (category === 'food') currentFoodType = item.id;
                    renderShop(); // Обновить рамки
                } else {
                    // Покупаем
                    if (crystals >= item.price) {
                        crystals -= item.price;
                        updateUI();
                        if (category === 'color') inventory.colors.push(item.id);
                        if (category === 'face') inventory.faces.push(item.id);
                        if (category === 'food') inventory.food.push(item.id);
                        renderShop();
                    } else {
                        alert("Не хватает кристаллов!");
                    }
                }
            };

            container.appendChild(div);
        }

        // Управление (Свайпы)
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', function(e) {
            if(isShopOpen) return; // Не управлять змейкой в магазине

            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
        }, false);

        function handleSwipe(sx, sy, ex, ey) {
            let dx = ex - sx;
            let dy = ey - sy;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                // Горизонтально
                if (dx > 0 && velocity.x !== -1) velocity = {x: 1, y: 0};
                if (dx < 0 && velocity.x !== 1) velocity = {x: -1, y: 0};
            } else {
                // Вертикально
                if (dy > 0 && velocity.y !== -1) velocity = {x: 0, y: 1};
                if (dy < 0 && velocity.y !== 1) velocity = {x: 0, y: -1};
            }
        }

        // Управление клавиатурой (для тестов на ПК)
        document.addEventListener('keydown', e => {
            if(isShopOpen) return;
            switch(e.key) {
                case 'ArrowUp': if(velocity.y !== 1) velocity = {x: 0, y: -1}; break;
                case 'ArrowDown': if(velocity.y !== -1) velocity = {x: 0, y: 1}; break;
                case 'ArrowLeft': if(velocity.x !== 1) velocity = {x: -1, y: 0}; break;
                case 'ArrowRight': if(velocity.x !== -1) velocity = {x: 1, y: 0}; break;
            }
        });

        // Запуск
        updateUI();
        gameLoop();

    </script>
</body>
</html>
