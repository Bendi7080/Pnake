<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pnake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #FFF0F5; /* Светло-розовый фон */
            font-family: 'Fredoka One', cursive;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
        }

        /* Интерфейс: счет и шестеренка */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .score-board {
            font-size: 24px;
            color: #FF69B4;
            text-shadow: 2px 2px 0px #FFF;
        }

        .settings-btn {
            font-size: 24px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #FF69B4;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #FF69B4;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
        }

        /* Экран Магазина */
        #shop-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 240, 245, 0.98);
            display: none; /* Появится через JS */
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            pointer-events: auto;
            overflow-y: auto;
            z-index: 100;
        }

        h2 {
            color: #FF69B4;
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #FFF;
        }

        /* Розовая стрелка Назад */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 30px;
            color: #FF69B4;
            cursor: pointer;
            background: #FFF;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
            border: 3px solid #FF69B4;
            transition: transform 0.2s;
        }
        .back-arrow:active { transform: scale(0.9); }

        .shop-section {
            width: 90%;
            margin-bottom: 25px;
            background: #FFF;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.3);
            border: 2px solid #FFC0CB;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 20px;
            color: #FF69B4;
            margin-bottom: 12px;
            text-align: center;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 12px;
        }

        .shop-item {
            aspect-ratio: 1;
            border-radius: 15px;
            background: #FAFAFA;
            border: 2px solid #EEE;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .shop-item.selected { border: 3px solid #FF69B4; background: #FFF0F5; }
        .shop-item.locked { opacity: 0.6; }

        /* Индикаторы редкости */
        .rarity-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            right: 6px;
        }
        .basic { background: #B0B0B0; }
        .rare { background: #00BFFF; box-shadow: 0 0 5px #00BFFF; }
        .epic { background: #BF5FFF; box-shadow: 0 0 5px #BF5FFF; }
        .legendary { background: #FFD700; box-shadow: 0 0 8px #FFD700; }

        .item-preview {
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 4px;
        }

        .price-tag { font-size: 11px; color: #555; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="header">
            <div class="score-board">🍎 <span id="score">0</span> | 💎 <span id="crystals">0</span></div>
            <div class="settings-btn" onclick="toggleShop()">⚙️</div>
        </div>
    </div>

    <div id="shop-screen">
        <div class="back-arrow" onclick="toggleShop()">←</div>
        <h2>Магазин</h2>

        <div class="shop-section">
            <div class="section-title">Цвет Pnake</div>
            <div class="items-grid" id="color-grid"></div>
        </div>

        <div class="shop-section">
            <div class="section-title">Глазки (Лица)</div>
            <div class="items-grid" id="face-grid"></div>
        </div>

        <div class="shop-section">
            <div class="section-title">Вкусняшки</div>
            <div class="items-grid" id="food-grid"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

        <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Настройки экрана
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            tileCountX = Math.floor(canvas.width / gridSize);
            tileCountY = Math.floor(canvas.height / gridSize);
        }

        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let score = 0;
        let crystals = 100; 
        let isShopOpen = false;
        const gridSize = 25;
        let tileCountX, tileCountY;

        let snake = [{x: 10, y: 10}];
        let velocity = {x: 0, y: 0};
        let food = {x: 5, y: 5};

        // Текущие настройки (то, что выбрано)
        let snakeColor = '#FF69B4'; 
        let currentFace = 'normal'; 
        let currentFoodType = 'apple';

        // База данных магазина
        const shopData = {
            colors: [
                { id: 'pink', name: 'Розовый', color: '#FF69B4', price: 0, rarity: 'basic' },
                { id: 'blue', name: 'Голубой', color: '#87CEEB', price: 50, rarity: 'rare' },
                { id: 'mint', name: 'Мятный', color: '#98FF98', price: 50, rarity: 'rare' },
                { id: 'light green', name: 'Салатовый', color: '#90EE90', price: 100, rarity: 'epic' },
                { id: 'lavender', name: 'Лавандовый', color: '#E6E6FA', price: 150, rarity: 'epic' },
                { id: 'indian red', name: 'Красный', color: '#CD5C5C', price: 250, rarity: 'legendary' },
                { id: 'gold', name: 'Золотой', color: '#FFD700', price: 400, rarity: 'legendary' }
            ],
            faces: [
                { id: 'normal', name: 'Точки', price: 0, rarity: 'basic' },
                { id: 'happy', name: 'Улыбка', price: 100, rarity: 'rare' },
                { id: 'kawaii', name: 'Кавай', price: 150, rarity: 'epic' },
                { id: 'cool', name: 'Крутой', price: 300, rarity: 'legendary' }
            ],
            food: [
                { id: 'apple', icon: '🍎', price: 0, rarity: 'basic' },
                { id: 'banana', icon: '🍌', price: 50, rarity: 'rare' },
                { id: 'strawberry', icon: '🍓'. price: 50, rarity: 'rare' },
                { id: 'cherry', icon: '🍒', price: 50, rarity: 'rare' },
                { id: 'blueberry', icon: '🫐', price: 100, ratity: 'epic'
                { id: 'pizza', icon: '🍕', price: 120, rarity: 'epic' },
                { id: 'burger', icon: '🍔', price: 120, rarity: 'epic' },
                { id: 'tulip', icon: '🌷', price: 200, rarity: 'legendary' },
                { id: 'rose', icon: '🌹', price: 200, rarity: 'legendary' }
            ]
        };

        // Инвентарь (храним купленные ID)
        let inventory = {
            colors: ['pink'],
            faces: ['normal'],
            food: ['apple']
        };

        // --- ЛОГИКА МАГАЗИНА ---
        function toggleShop() {
            isShopOpen = !isShopOpen;
            const shop = document.getElementById('shop-screen');
            shop.style.display = isShopOpen ? 'flex' : 'none';
            if (isShopOpen) renderShop();
        }

        function renderShop() {
            renderSection('color-grid', shopData.colors, 'color');
            renderSection('face-grid', shopData.faces, 'face');
            renderSection('food-grid', shopData.food, 'food');
        }

        function renderSection(gridId, items, type) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = `shop-item ${item.rarity}`;
                
                // Проверка владения и выбора
                const isOwned = inventory[type === 'color' ? 'colors' : type === 'face' ? 'faces' : 'food'].includes(item.id);
                const isSelected = (type === 'color' && snakeColor === item.color) ||
                                 (type === 'face' && currentFace === item.id) ||
                                 (type === 'food' && currentFoodType === item.id);

                if (isSelected) div.classList.add('selected');
                if (!isOwned) div.classList.add('locked');

                // Создаем иконку для превью
                let preview = '';
                if (type === 'color') preview = `<div class="item-preview" style="background:${item.color}; border-radius:50%"></div>`;
                if (type === 'food') preview = `<div class="item-preview" style="font-size:24px">${item.icon}</div>`;
                if (type === 'face') {
                    let faceText = '● ●';
                    if (item.id === 'happy') faceText = '^ ^';
                    if (item.id === 'kawaii') faceText = '◕ ◕';
                    if (item.id === 'cool') faceText = '🕶';
                    preview = `<div class="item-preview" style="font-size:14px; color:#333">${faceText}</div>`;
                }

                div.innerHTML = `
                    <div class="rarity-dot ${item.rarity}"></div>
                    ${preview}
                    <div class="price-tag">${isOwned ? (isSelected ? 'Снято' : 'Надеть') : '💎 ' + item.price}</div>
                `;

                div.onclick = () => {
                    if (isOwned) {
                        if (type === 'color') snakeColor = item.color;
                        if (type === 'face') currentFace = item.id;
                        if (type === 'food') currentFoodType = item.id;
                    } else if (crystals >= item.price) {
                        crystals -= item.price;
                        inventory[type === 'color' ? 'colors' : type === 'face' ? 'faces' : 'food'].push(item.id);
                        document.getElementById('crystals').innerText = crystals;
                    }
                    renderShop();
                };
                grid.appendChild(div);
            });
        }

        // --- ЛОГИКА ИГРЫ ---
        function update() {
            if (isShopOpen || (velocity.x === 0 && velocity.y === 0)) return;

            const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            // Стены
            if(head.x < 0) head.x = tileCountX - 1;
            if(head.x >= tileCountX) head.x = 0;
            if(head.y < 0) head.y = tileCountY - 1;
            if(head.y >= tileCountY) head.y = 0;

            // Столкновение с собой
            for(let part of snake) {
                if(head.x === part.x && head.y === part.y) {
                    resetGame();
                    return;
                }
            }

            snake.unshift(head);

            // Поедание
            if(head.x === food.x && head.y === food.y) {
                score++;
                crystals += 2;
                document.getElementById('score').innerText = score;
                document.getElementById('crystals').innerText = crystals;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCountX);
            food.y = Math.floor(Math.random() * tileCountY);
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            velocity = {x: 0, y: 0};
            score = 0;
            document.getElementById('score').innerText = score;
        }

        function draw() {
            ctx.fillStyle = '#FFF0F5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем еду
            const foodIcon = shopData.food.find(f => f.id === currentFoodType).icon;
            ctx.font = `${gridSize}px Arial`;
            ctx.fillText(foodIcon, food.x * gridSize, food.y * gridSize + gridSize - 5);

            // Рисуем Pnake
            snake.forEach((part, i) => {
                ctx.fillStyle = snakeColor;
                ctx.beginPath();
                const radius = i === 0 ? 10 : 6;
                ctx.roundRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2, radius);
                ctx.fill();

                // Рисуем глазки на голове
                if (i === 0) {
                    drawFace(part.x * gridSize, part.y * gridSize);
                }
            });
        }

        function drawFace(x, y) {
            ctx.fillStyle = '#000';
            const eyeSize = 3;
            const offset = gridSize / 4;

            if (currentFace === 'normal') {
                ctx.beginPath();
                ctx.arc(x + offset, y + offset + 2, eyeSize, 0, Math.PI*2);
                ctx.arc(x + gridSize - offset, y + offset + 2, eyeSize, 0, Math.PI*2);
                ctx.fill();
            } else if (currentFace === 'happy') {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x + offset, y + offset + 4, 4, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(x + gridSize - offset, y + offset + 4, 4, Math.PI, 0);
                ctx.stroke();
            } else if (currentFace === 'kawaii') {
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(x + offset, y + offset + 4, 5, 0, Math.PI*2);
                ctx.arc(x + gridSize - offset, y + offset + 4, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(x + offset - 1, y + offset + 3, 1.5, 0, Math.PI*2);
                ctx.arc(x + gridSize - offset - 1, y + offset + 3, 1.5, 0, Math.PI*2);
                ctx.fill();
            } else if (currentFace === 'cool') {
                ctx.fillStyle = '#000';
                ctx.fillRect(x + 3, y + offset, gridSize - 6, 6); // Очки
            }
        }

        // Управление
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' && velocity.y === 0) velocity = {x: 0, y: -1};
            if (e.key === 'ArrowDown' && velocity.y === 0) velocity = {x: 0, y: 1};
            if (e.key === 'ArrowLeft' && velocity.x === 0) velocity = {x: -1, y: 0};
            if (e.key === 'ArrowRight' && velocity.x === 0) velocity = {x: 1, y: 0};
        });

        // Свайпы для мобилок
        let startX, startY;
        canvas.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });
        canvas.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && velocity.x === 0) velocity = {x: 1, y: 0};
                else if (dx < 0 && velocity.x === 0) velocity = {x: -1, y: 0};
            } else {
                if (dy > 0 && velocity.y === 0) velocity = {x: 0, y: 1};
                else if (dy < 0 && velocity.y === 0) velocity = {x: 0, y: -1};
            }
        });

        function gameLoop() {
            update();
            draw();
            setTimeout(gameLoop, 150);
        }

        window.addEventListener('resize', resize);
        resize();
        gameLoop();
    </script>
</body>
</html>
