<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pnake - Super Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        :root {
            --bg: #FFF0F5; --primary: #FF69B4; --secondary: #FFC0CB; --text: #FF69B4;
            --panel: #FFFFFF; --wall: #000000;
        }
        .dark-mode {
            --bg: #2D2D2D; --panel: #3D3D3D; --text: #FFB6C1; --secondary: #4A4A4A;
        }
        body {
            margin: 0; overflow: hidden; font-family: 'Fredoka One', cursive;
            background-color: var(--bg); color: var(--text); touch-action: none;
        }
        #ui-container > div { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; background: var(--bg); z-index: 10; }
        #ui-container > div.active { display: flex; }
        
        button {
            background: var(--primary); color: white; border: none; padding: 12px 25px;
            border-radius: 15px; font-family: inherit; font-size: 18px; cursor: pointer; margin: 10px;
            box-shadow: 0 4px 0px #d44d91; transition: 0.1s;
        }
        button:active { transform: translateY(3px); box-shadow: 0 1px 0px #d44d91; }
        input { padding: 12px; border-radius: 10px; border: 2px solid var(--primary); margin: 5px; text-align: center; font-family: inherit; }

        /* Специальные элементы */
        .back-arrow { position: absolute; top: 20px; left: 20px; font-size: 30px; color: var(--primary); cursor: pointer; background: var(--panel); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 3px solid var(--primary); }
        .settings-top { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .stat-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.8); padding: 5px 15px; border-radius: 20px; border: 2px solid var(--primary); z-index: 5; pointer-events: none; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 400px; }
        .shop-item { background: var(--panel); border: 2px solid var(--secondary); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; position: relative; }
        .shop-item.selected { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .rarity { width: 8px; height: 8px; border-radius: 50%; position: absolute; top: 5px; right: 5px; }

        canvas { display: block; background: #000; }
    </style>
</head>
<body>

<div id="ui-container">
    <div id="screen-auth" class="active">
        <h1>Pnake 🐍</h1>
        <input type="text" id="auth-user" placeholder="Логин">
        <input type="password" id="auth-pass" placeholder="Пароль">
        <button onclick="app.auth()">Войти / Создать</button>
    </div>

    <div id="screen-menu">
        <div class="settings-top">
            <button onclick="app.toggleTheme()">🌓</button>
            <button onclick="app.toggleMusic()">🎵</button>
        </div>
        <h2>Привет, <span id="user-name"></span>!</h2>
        <p>💎 Кристаллы: <span id="user-gems">0</span></p>
        <button onclick="app.showScreen('screen-modes')">ИГРАТЬ</button>
        <button onclick="app.showScreen('screen-shop')">МАГАЗИН</button>
    </div>

    <div id="screen-modes">
        <div class="back-arrow" onclick="app.showScreen('screen-menu')">←</div>
        <h2>Выбери режим</h2>
        <button onclick="app.startGame('classic')">Классика (Стены 💀)</button>
        <button onclick="app.startGame('portal')">Портал (Телепорт 🌀)</button>
        <button onclick="app.startGame('ghost')">Призрак (Сквозь тело 👻)</button>
    </div>

    <div id="screen-shop">
        <div class="back-arrow" onclick="app.showScreen('screen-menu')">←</div>
        <h2>Магазин</h2>
        <div id="shop-content" style="overflow-y: auto; width: 100%;">
            <p>Цвета</p><div id="shop-colors" class="grid"></div>
            <p>Глазки</p><div id="shop-faces" class="grid"></div>
            <p>Еда</p><div id="shop-food" class="grid"></div>
        </div>
    </div>
</div>

<div class="stat-bar" id="game-stats" style="display:none">
    🍎 <span id="cur-score">0</span> | 💎 <span id="cur-gems">0</span> | Рекорд: <span id="cur-hi">0</span>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// --- Звуковой движок (Web Audio API) ---
const audio = {
    ctx: new (window.AudioContext || window.webkitAudioContext)(),
    enabled: true,
    play(freq, type = 'sine', duration = 0.1) {
        if (!this.enabled) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    },
    eat() { this.play(600, 'square'); },
    click() { this.play(400, 'sine', 0.05); },
    fail() { this.play(150, 'sawtooth', 0.5); }
};

// --- Данные игры ---
const app = {
    user: null,
    currentMode: 'classic',
    theme: 'light',
    
    shop: {
        colors: [
            {id:'pink', val:'#FF69B4', p:0, r:'basic'}, {id:'blue', val:'#87CEEB', p:40, r:'rare'},
            {id:'mint', val:'#98FF98', p:40, r:'rare'}, {id:'lavender', val:'#E6E6FA', p:80, r:'epic'},
            {id:'gold', val:'#FFD700', p:240, r:'legendary'}
        ],
        faces: [
            {id:'dot', val:'●●', p:0, r:'basic'}, {id:'happy', val:'^^', p:40, r:'rare'},
            {id:'kawaii', val:'◕◕', p:100, r:'epic'}, {id:'cool', val:'🕶', p:300, r:'legendary'}
        ],
        food: [
            {id:'apple', val:'🍎', p:0, r:'basic'}, {id:'cherry', val:'🍒', p:20, r:'rare'},
            {id:'strawberry', val:'🍓', p:40, r:'rare'}, {id:'peach', val:'🍑', p:50, r:'epic'},
            {id:'pizza', val:'🍕', p:100, r:'epic'}, {id:'burger', val:'🍔', p:150, r:'legendary'},
            {id:'fries', val:'🍟', p:200, r:'legendary'}, {id:'kebab', val:'🍢', p:240, r:'legendary'}
        ]
    },

    auth() {
        const name = document.getElementById('auth-user').value;
        const pass = document.getElementById('auth-pass').value;
        if (!name || !pass) return alert("Введи данные!");
        
        let stored = JSON.parse(localStorage.getItem('pnake_user_' + name));
        if (stored) {
            if (stored.pass !== pass) return alert("Неверный пароль!");
            this.user = stored;
        } else {
            this.user = { name, pass, gems: 0, inv: ['pink', 'dot', 'apple'], 
                         setup: {c:'pink', f:'dot', fo:'apple'}, hi: {classic:0, portal:0, ghost:0} };
        }
        this.save(); this.showScreen('screen-menu'); audio.click();
    },

    save() {
        localStorage.setItem('pnake_user_' + this.user.name, JSON.stringify(this.user));
        document.getElementById('user-name').innerText = this.user.name;
        document.getElementById('user-gems').innerText = this.user.gems;
    },

    showScreen(id) {
        document.querySelectorAll('#ui-container > div').forEach(d => d.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'screen-shop') this.renderShop();
        audio.click();
    },

    toggleTheme() {
        this.theme = this.theme === 'light' ? 'dark' : 'light';
        document.body.classList.toggle('dark-mode');
        audio.click();
    },

    toggleMusic() { audio.enabled = !audio.enabled; audio.click(); },

    renderShop() {
        const drawGrid = (containerId, items, type, setupKey) => {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            items.forEach(item => {
                const isOwned = this.user.inv.includes(item.id);
                const isSelected = this.user.setup[setupKey] === item.id;
                const div = document.createElement('div');
                div.className = `shop-item ${isSelected ? 'selected' : ''}`;
                div.innerHTML = `<div class="rarity" style="background:${this.getRarity(item.r)}"></div>
                                 <div style="font-size:20px">${item.val.length > 7 ? '🎨' : item.val}</div>
                                 <div style="font-size:10px">${isOwned ? (isSelected ? '✓' : 'ВЗЯТЬ') : '💎'+item.p}</div>`;
                if (isSelected) div.style.backgroundColor = 'var(--secondary)';
                div.onclick = () => {
                    if (isOwned) { this.user.setup[setupKey] = item.id; }
                    else if (this.user.gems >= item.p) {
                        this.user.gems -= item.p; this.user.inv.push(item.id);
                        this.user.setup[setupKey] = item.id;
                    }
                    this.save(); this.renderShop(); audio.click();
                };
                container.appendChild(div);
            });
        };
        drawGrid('shop-colors', this.shop.colors, 'c', 'c');
        drawGrid('shop-faces', this.shop.faces, 'f', 'f');
        drawGrid('shop-food', this.shop.food, 'fo', 'fo');
    },

    getRarity(r) {
        return {basic:'#A0A0A0', rare:'#00BFFF', epic:'#9370DB', legendary:'#FFD700'}[r];
    },

    startGame(mode) {
        this.currentMode = mode;
        this.showScreen('none');
        document.getElementById('game-stats').style.display = 'block';
        game.init();
    }
};

// --- Игровой Движок ---
const game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: document.getElementById('gameCanvas').getContext('2d'),
    grid: 20, snake: [], dir: {x:0, y:0}, food: {}, score: 0,
    wallColor: '#000', bgColor: '#000',

    init() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.tileX = Math.floor(this.canvas.width / this.grid);
        this.tileY = Math.floor(this.canvas.height / this.grid);
        this.snake = [{x: 10, y: 10}];
        this.dir = {x:0, y:0}; this.score = 0;
        this.wallColor = '#000'; this.bgColor = '#000';
        this.spawnFood();
        document.getElementById('cur-hi').innerText = app.user.hi[app.currentMode];
        if(!this.running) { this.running = true; this.loop(); }
    },

    spawnFood() {
        this.food = { x: Math.floor(Math.random()*this.tileX), y: Math.floor(Math.random()*this.tileY) };
    },

    update() {
        if(this.dir.x === 0 && this.dir.y === 0) return;
        const head = { x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y };

        // Режимы Стен
        if(app.currentMode === 'classic' || app.currentMode === 'ghost') {
            if(head.x < 0 || head.x >= this.tileX || head.y < 0 || head.y >= this.tileY) return this.over();
        } else { // Portal
            if(head.x < 0) head.x = this.tileX - 1; if(head.x >= this.tileX) head.x = 0;
            if(head.y < 0) head.y = this.tileY - 1; if(head.y >= this.tileY) head.y = 0;
        }

        // Режимы Тела
        if(app.currentMode !== 'ghost') {
            for(let p of this.snake) if(p.x === head.x && p.y === head.y) return this.over();
        }

        this.snake.unshift(head);
        if(head.x === this.food.x && head.y === this.food.y) {
            this.score++; app.user.gems += 2;
            audio.eat(); this.spawnFood();
            if(this.score % 10 === 0) {
                this.wallColor = `hsl(${Math.random()*360}, 70%, 50%)`;
                this.bgColor = `hsl(${Math.random()*360}, 20%, 10%)`;
            }
        } else { this.snake.pop(); }

        document.getElementById('cur-score').innerText = this.score;
        document.getElementById('cur-gems').innerText = app.user.gems;
    },

    draw() {
        this.ctx.fillStyle = this.bgColor;
        this.ctx.fillRect(0,0,this.canvas.width, this.canvas.height);
        
        // Стены
        this.ctx.strokeStyle = this.wallColor; this.ctx.lineWidth = 5;
        this.ctx.strokeRect(0,0,this.canvas.width, this.canvas.height);

        // Еда
        const f = app.shop.food.find(i => i.id === app.user.setup.fo);
        this.ctx.font = "18px Arial";
        this.ctx.fillText(f.val, this.food.x*this.grid, this.food.y*this.grid + 15);

        // Змейка
        const sColor = app.shop.colors.find(i => i.id === app.user.setup.c).val;
        this.snake.forEach((p, i) => {
            this.ctx.fillStyle = sColor;
            this.ctx.beginPath();
            this.ctx.roundRect(p.x*this.grid, p.y*this.grid, this.grid-1, this.grid-1, i===0?8:4);
            this.ctx.fill();
            if(i === 0) this.drawFace(p.x*this.grid, p.y*this.grid);
        });
    },

    drawFace(x, y) {
        const f = app.shop.faces.find(i => i.id === app.user.setup.f);
        this.ctx.fillStyle = '#000'; this.ctx.font = "bold 10px Arial";
        this.ctx.fillText(f.val, x+2, y+12);
    },

    over() {
        audio.fail();
        if(this.score > app.user.hi[app.currentMode]) app.user.hi[app.currentMode] = this.score;
        app.save();
        alert(`Игра окончена! Счет: ${this.score}`);
        document.getElementById('game-stats').style.display = 'none';
        app.showScreen('screen-menu');
        this.dir = {x:0, y:0};
    },

    loop() {
        if(this.running) {
            this.update(); this.draw();
            setTimeout(() => requestAnimationFrame(() => this.loop()), 150);
        }
    }
};

// Управление
window.addEventListener('keydown', e => {
    if(e.key === 'ArrowUp' && game.dir.y === 0) game.dir = {x:0, y:-1};
    if(e.key === 'ArrowDown' && game.dir.y === 0) game.dir = {x:0, y:1};
    if(e.key === 'ArrowLeft' && game.dir.x === 0) game.dir = {x:-1, y:0};
    if(e.key === 'ArrowRight' && game.dir.x === 0) game.dir = {x:1, y:0};
});

let tsX, tsY;
window.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; });
window.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tsX, dy = e.changedTouches[0].clientY - tsY;
    if(Math.abs(dx) > Math.abs(dy)) {
        if(dx > 0 && game.dir.x === 0) game.dir = {x:1, y:0}; else if(dx < 0 && game.dir.x === 0) game.dir = {x:-1, y:0};
    } else {
        if(dy > 0 && game.dir.y === 0) game.dir = {x:0, y:1}; else if(dy < 0 && game.dir.y === 0) game.dir = {x:0, y:-1};
    }
});
</script>
</body>
</html>
