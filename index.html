<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pnake</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF69B4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pnake">

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

:root{
--bg:#FFF0F5;
--panel:#fff;
--main:#FF69B4;
--text:#FF69B4;
}

.dark{
--bg:#222;
--panel:#333;
--text:#FFB6C1;
}

body{
margin:0;
font-family:'Fredoka One',cursive;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

.screen{
display:none;
position:fixed;
inset:0;
justify-content:center;
align-items:center;
flex-direction:column;
background:var(--bg);
}

.screen.active{display:flex}

button,input{
font-family:inherit;
padding:12px 20px;
border-radius:14px;
border:none;
margin:6px;
font-size:18px;
}

button{
background:var(--main);
color:white;
}

canvas{
display:block;
background:black;
}
</style>
</head>

<body>

<div id="login" class="screen active">
<h1>Pnake 🐍</h1>
<input id="user" placeholder="Логин">
<input id="pass" type="password" placeholder="Пароль">
<button onclick="login()">Войти / Создать</button>
</div>

<div id="menu" class="screen">
<h2>Привет, <span id="uname"></span></h2>
<p>💎 <span id="gems">0</span></p>
<button onclick="start('classic')">Классика</button>
<button onclick="start('portal')">Портал</button>
<button onclick="start('ghost')">Призрак</button>
<button onclick="toggleTheme()">🌓</button>
</div>

<canvas id="game"></canvas>

<script>
/* ===== ЗВУК ===== */
const audioCtx=new AudioContext();
function beep(f,d=0.1){
let o=audioCtx.createOscillator();
let g=audioCtx.createGain();
o.frequency.value=f;
o.connect(g); g.connect(audioCtx.destination);
g.gain.value=0.1;
o.start(); o.stop(audioCtx.currentTime+d);
}

/* ===== АККАУНТ ===== */
let user=null;

function login(){
let u=userInput.value,p=passInput.value;
if(!u||!p)return;
let d=JSON.parse(localStorage.getItem("pnake_"+u));
if(d && d.pass!==p)return alert("Неверный пароль");
user=d||{name:u,pass:p,gems:0,hi:{classic:0,portal:0,ghost:0}};
save();
show(menu);
}

function save(){
localStorage.setItem("pnake_"+user.name,JSON.stringify(user));
uname.textContent=user.name;
gems.textContent=user.gems;
}

const userInput=document.getElementById("user");
const passInput=document.getElementById("pass");
const uname=document.getElementById("uname");
const gems=document.getElementById("gems");

/* ===== ЭКРАНЫ ===== */
function show(el){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
el.classList.add("active");
}

/* ===== ТЕМА ===== */
function toggleTheme(){
document.body.classList.toggle("dark");
}

/* ===== ИГРА ===== */
const c=document.getElementById("game");
const ctx=c.getContext("2d");
let grid=20,snake,dir,food,score,mode,wall="#000",bg="#000";

function start(m){
mode=m;
show(c);
resize();
reset();
loop();
}

function resize(){
c.width=innerWidth;
c.height=innerHeight;
}

function reset(){
snake=[{x:5,y:5}];
dir={x:0,y:0};
score=0;
food=rand();
wall="#000"; bg="#000";
}

function rand(){
return{
x:Math.floor(Math.random()*c.width/grid),
y:Math.floor(Math.random()*c.height/grid)
};
}

function update(){
if(!dir.x&&!dir.y)return;
let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

if(mode!=="portal"){
if(h.x<0||h.y<0||h.x*c.width/grid>=c.width||h.y*c.height/grid>=c.height) return end();
}else{
h.x=(h.x+c.width/grid)%(c.width/grid);
h.y=(h.y+c.height/grid)%(c.height/grid);
}

if(mode!=="ghost"){
for(let p of snake) if(p.x==h.x&&p.y==h.y) return end();
}

snake.unshift(h);

if(h.x==food.x&&h.y==food.y){
score++; user.gems+=2; beep(600);
food=rand();
if(score%10==0){
wall=`hsl(${Math.random()*360},80%,50%)`;
bg=`hsl(${Math.random()*360},30%,10%)`;
}
}else snake.pop();

save();
}

function draw(){
ctx.fillStyle=bg;
ctx.fillRect(0,0,c.width,c.height);

ctx.strokeStyle=wall;
ctx.lineWidth=4;
ctx.strokeRect(0,0,c.width,c.height);

ctx.fillText("🍎",food.x*grid,food.y*grid+16);

ctx.fillStyle="#FF69B4";
snake.forEach(p=>{
ctx.fillRect(p.x*grid,p.y*grid,grid-1,grid-1);
});
}

function loop(){
update();
draw();
setTimeout(()=>requestAnimationFrame(loop),150);
}

function end(){
beep(150,0.5);
if(score>user.hi[mode]) user.hi[mode]=score;
save();
alert("Игра окончена: "+score);
show(menu);
}

addEventListener("keydown",e=>{
if(e.key=="ArrowUp"&&dir.y==0)dir={x:0,y:-1};
if(e.key=="ArrowDown"&&dir.y==0)dir={x:0,y:1};
if(e.key=="ArrowLeft"&&dir.x==0)dir={x:-1,y:0};
if(e.key=="ArrowRight"&&dir.x==0)dir={x:1,y:0};
});

/* ===== PWA ===== */
if("serviceWorker"in navigator){
navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
