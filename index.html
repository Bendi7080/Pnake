<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pnake - Neon Snake Game</title>
    <style>
        :root {
            --neon-pink: #ff007f;
            --dark-bg: #1a1a2e;
            --btn-bg: #16213e;
            --text-gold: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 400px;
            height: 600px;
            background: var(--dark-bg);
            border: 3px solid var(--neon-pink);
            position: relative;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
        }

        .active { display: flex; }

        /* Заголовки и текст */
        h1 { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); font-size: 3rem; margin-top: 50px; }
        .currency { color: var(--text-gold); font-weight: bold; margin: 10px 0; }

        /* Кнопки */
        button {
            background: var(--btn-bg);
            color: white;
            border: 2px solid var(--neon-pink);
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            width: 200px;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        button:hover { background: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }

        /* Поля ввода */
        input {
            padding: 10px;
            margin: 5px;
            background: #0f3460;
            border: 1px solid var(--neon-pink);
            color: white;
        }

        /* Настройки в углу */
        .settings-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }

        /* Игровое поле */
        canvas {
            background: black;
            border: 4px solid black;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Магазин */
        .shop-tabs { display: flex; gap: 5px; }
        .shop-item {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 5px 10px;
            margin: 3px 0;
            font-size: 0.9rem;
        }

        /* Пауза */
        .pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="settings-trigger" class="settings-icon" onclick="showScreen('screen-settings')">⚙️</div>

    <div id="screen-auth" class="screen active">
        <h1>PNAKE</h1>
        <input type="text" id="auth-login" placeholder="Логин">
        <input type="password" id="auth-pass" placeholder="Пароль">
        <button onclick="handleLogin()">Войти</button>
        <button onclick="handleRegister()">Регистрация</button>
    </div>

    <div id="screen-menu" class="screen">
        <div class="currency">Зменет: <span id="user-coins">0</span></div>
        <h2 id="welcome-text">Привет!</h2>
        <button onclick="startGame()" style="height: 100px; font-weight: bold;">ИГРАТЬ</button>
        <button onclick="showScreen('screen-shop')">МАГАЗИН</button>
        <button onclick="showScreen('screen-auth')">Выход</button>
    </div>

    <div id="screen-settings" class="screen">
        <h2>Настройки</h2>
        <button onclick="toggleSetting('music')">Музыка: <span id="set-music">ВКЛ</span></button>
        <button onclick="toggleSetting('sound')">Звук: <span id="set-sound">ВКЛ</span></button>
        <button onclick="toggleTheme()">Режим: <span id="set-theme">НОЧЬ</span></button>
        <button onclick="showScreen('screen-menu')">Назад</button>
    </div>

    <div id="screen-shop" class="screen">
        <div class="currency">Баланс: <span id="shop-coins">0</span></div>
        <div class="shop-tabs">
            <button onclick="renderShop('colors')" style="width: 80px; font-size: 0.7rem;">ЦВЕТА</button>
            <button onclick="renderShop('food')" style="width: 80px; font-size: 0.7rem;">ЕДА</button>
            <button onclick="renderShop('shapes')" style="width: 80px; font-size: 0.7rem;">ФОРМЫ</button>
        </div>
        <div id="shop-content" style="width: 100%; margin-top: 10px;"></div>
        <button onclick="showScreen('screen-menu')">Назад</button>
    </div>

    <div id="screen-game" class="screen" style="padding: 0; justify-content: flex-start;">
        <div id="game-ui" style="width: 100%; padding: 10px; display: flex; justify-content: space-between;">
            <span>Счет: <span id="game-score">0</span></span>
        </div>
        <button class="pause-btn" onclick="pauseGame()">■</button>
        <canvas id="gameCanvas" width="360" height="400"></canvas>
        <div style="display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; margin-top: 20px;">
            <div></div><button onclick="setDir('up')" style="width:60px">▲</button><div></div>
            <button onclick="setDir('left')" style="width:60px">◀</button>
            <button onclick="setDir('down')" style="width:60px">▼</button>
            <button onclick="setDir('right')" style="width:60px">▶</button>
        </div>
    </div>
</div>

<script>
    // --- ДАННЫЕ И СОСТОЯНИЕ ---
    let users = JSON.parse(localStorage.getItem('pnake_users') || '{}');
    let currentUser = null;
    let gameInterval = null;
    let gameState = {
        snake: [],
        dir: 'down',
        food: {x: 0, y: 0},
        score: 0,
        isPaused: false
    };

    const shopData = {
        colors: [{id: 'pink', p: 0, n: 'Розовый'}, {id: 'white', p: 50, n: 'Белый'}, {id: 'black', p: 100, n: 'Черный'}],
        food: [{id: 'apple', p: 0, n: 'Яблоко'}, {id: 'strawberry', p: 50, n: 'Клубника'}, {id: 'cupcake', p: 100, n: 'Кекс'}],
        shapes: [{id: 'square', p: 0, n: 'Квадрат'}, {id: 'circle', p: 100, n: 'Круг'}, {id: 'connected', p: 200, n: 'Слитная'}]
    };

    const pastelColors = ["#FFB3BA", "#FFDFBA", "#FFFFBA", "#BAFFC9", "#BAE1FF", "#E6E6FA"];

    // --- НАВИГАЦИЯ ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('settings-trigger').style.display = (id === 'screen-menu') ? 'block' : 'none';
        if(id === 'screen-menu') updateUI();
    }

    // --- АУТЕНТИФИКАЦИЯ ---
    function handleRegister() {
        const l = document.getElementById('auth-login').value;
        const p = document.getElementById('auth-pass').value;
        if(!l || !p) return alert('Заполни поля!');
        if(users[l]) return alert('Уже есть!');
        users[l] = {
            pass: p, coins: 0,
            inv: { colors:['pink'], food:['apple'], shapes:['square'] },
            sel: { color:'pink', food:'apple', shape:'square' },
            set: { music:true, sound:true, theme:'night' }
        };
        save();
        alert('Успех!');
    }

    function handleLogin() {
        const l = document.getElementById('auth-login').value;
        const p = document.getElementById('auth-pass').value;
        if(users[l] && users[l].pass === p) {
            currentUser = l;
            showScreen('screen-menu');
        } else alert('Ошибка!');
    }

    function save() { localStorage.setItem('pnake_users', JSON.stringify(users)); }

    function updateUI() {
        const u = users[currentUser];
        document.getElementById('user-coins').innerText = u.coins;
        document.getElementById('shop-coins').innerText = u.coins;
        document.getElementById('welcome-text').innerText = "Игрок: " + currentUser;
        document.getElementById('set-music').innerText = u.set.music ? "ВКЛ" : "ВЫКЛ";
        document.getElementById('set-sound').innerText = u.set.sound ? "ВКЛ" : "ВЫКЛ";
        document.getElementById('set-theme').innerText = u.set.theme === 'night' ? "НОЧЬ" : "ДЕНЬ";
    }

    // --- МАГАЗИН ---
    function renderShop(cat) {
        const u = users[currentUser];
        let html = '';
        shopData[cat].forEach(item => {
            const owned = u.inv[cat].includes(item.id);
            const selected = u.sel[cat] === item.id;
            let btn = '';
            if(selected) btn = '<span>Выбрано</span>';
            else if(owned) btn = `<button onclick="selectItem('${cat}','${item.id}')" style="width:80px">Выбрать</button>`;
            else btn = `<button onclick="buyItem('${cat}','${item.id}',${item.p})" style="width:80px">Купить</button>`;
            
            html += `<div class="shop-item"><span>${item.n} (${item.p} зм.)</span> ${btn}</div>`;
        });
        document.getElementById('shop-content').innerHTML = html;
    }

    function buyItem(cat, id, p) {
        const u = users[currentUser];
        if(u.coins >= p) {
            u.coins -= p;
            u.inv[cat].push(id);
            save(); updateUI(); renderShop(cat);
        } else alert('Мало зменет!');
    }

    function selectItem(cat, id) {
        users[currentUser].sel[cat] = id;
        save(); renderShop(cat);
    }

    // --- НАСТРОЙКИ ---
    function toggleSetting(k) {
        users[currentUser].set[k] = !users[currentUser].set[k];
        save(); updateUI();
    }

    function toggleTheme() {
        const u = users[currentUser];
        u.set.theme = u.set.theme === 'night' ? 'day' : 'night';
        document.getElementById('app-container').style.background = u.set.theme === 'day' ? '#eee' : '#1a1a2e';
        document.getElementById('app-container').style.color = u.set.theme === 'day' ? '#333' : 'white';
        save(); updateUI();
    }

    // --- ИГРА ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;

    function startGame() {
        showScreen('screen-game');
        gameState = {
            snake: [{x: 5, y: 5}, {x: 4, y: 5}, {x: 3, y: 5}],
            dir: 'right',
            food: {x: 10, y: 10},
            score: 0,
            isPaused: false
        };
        canvas.style.backgroundColor = 'black';
        canvas.style.borderColor = 'black';
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameStep, 150);
    }

    function setDir(d) { gameState.dir = d; }

    function pauseGame() {
        if(confirm("Выйти в меню?")) {
            clearInterval(gameInterval);
            showScreen('screen-menu');
        }
    }

    function gameStep() {
        if(gameState.isPaused) return;

        let head = {...gameState.snake[0]};
        if(gameState.dir === 'up') head.y--;
        if(gameState.dir === 'down') head.y++;
        if(gameState.dir === 'left') head.x--;
        if(gameState.dir === 'right') head.x++;

        // Столкновения
        if(head.x < 0 || head.x >= 18 || head.y < 0 || head.y >= 20 || 
           gameState.snake.some(s => s.x === head.x && s.y === head.y)) {
            alert("Конец игры! Счет: " + gameState.score);
            users[currentUser].coins += gameState.score;
            save();
            clearInterval(gameInterval);
            showScreen('screen-menu');
            return;
        }

        gameState.snake.unshift(head);

        if(head.x === gameState.food.x && head.y === gameState.food.y) {
            gameState.score++;
            document.getElementById('game-score').innerText = gameState.score;
            gameState.food = {x: Math.floor(Math.random()*18), y: Math.floor(Math.random()*20)};
            if(gameState.score % 10 === 0) {
                let c = pastelColors[Math.floor(Math.random()*pastelColors.length)];
                canvas.style.backgroundColor = c;
                canvas.style.borderColor = c;
            }
        } else {
            gameState.snake.pop();
        }

        draw();
    }

    function draw() {
        ctx.clearRect(0,0, canvas.width, canvas.height);
        const u = users[currentUser];

        // Еда
        ctx.fillStyle = u.sel.food === 'apple' ? 'red' : (u.sel.food === 'strawberry' ? '#fc5a8d' : '#f2b552');
        ctx.beginPath();
        ctx.arc(gameState.food.x*20+10, gameState.food.y*20+10, 8, 0, Math.PI*2);
        ctx.fill();

        // Змейка
        ctx.fillStyle = u.sel.color === 'pink' ? '#ff007f' : u.sel.color;
        gameState.snake.forEach((s, i) => {
            if(u.sel.shape === 'circle') {
                ctx.beginPath();
                ctx.arc(s.x*20+10, s.y*20+10, 9, 0, Math.PI*2);
                ctx.fill();
            } else if(u.sel.shape === 'connected') {
                ctx.fillRect(s.x*20+1, s.y*20+1, 18, 18);
            } else {
                ctx.fillRect(s.x*20+2, s.y*20+2, 16, 16);
                ctx.strokeStyle = "black";
                ctx.strokeRect(s.x*20+2, s.y*20+2, 16, 16);
            }
        });
    }

    // Управление клавиатурой
    window.addEventListener('keydown', e => {
        if(e.key === 'ArrowUp') setDir('up');
        if(e.key === 'ArrowDown') setDir('down');
        if(e.key === 'ArrowLeft') setDir('left');
        if(e.key === 'ArrowRight') setDir('right');
    });

</script>
</body>
</html>
