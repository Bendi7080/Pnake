
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pnake 🐍</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
:root {
  --bg:#FFF0F5; --primary:#FF69B4; --secondary:#FFC0CB; --text:#FF69B4;
  --panel:#FFF; --wall:#000;
}
.dark-mode {
  --bg:#2D2D2D; --panel:#3D3D3D; --text:#FFB6C1; --secondary:#4A4A4A;
}
body {
  margin:0; overflow:hidden; font-family:'Fredoka One',cursive;
  background:var(--bg); color:var(--text); touch-action:none;
}
#ui-container>div{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:var(--bg);z-index:10;}
#ui-container>div.active{display:flex;}
button{
  background:var(--primary); color:white; border:none; padding:12px 25px;
  border-radius:15px; font-family:inherit; font-size:18px; cursor:pointer; margin:10px;
  box-shadow:0 4px 0px #d44d91; transition:.1s;
}
button:active{transform:translateY(3px); box-shadow:0 1px 0px #d44d91;}
input{padding:12px; border-radius:10px; border:2px solid var(--primary); margin:5px; text-align:center; font-family:inherit;}
.back-arrow{position:absolute;top:20px;left:20px;font-size:30px;color:var(--primary);cursor:pointer;background:var(--panel);width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid var(--primary);}
.settings-top{position:absolute;top:20px;right:20px;display:flex;gap:10px;}
.stat-bar{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.8);padding:5px 15px;border-radius:20px;border:2px solid var(--primary);z-index:5;pointer-events:none;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:400px;}
.shop-item{background:var(--panel);border:2px solid var(--secondary);border-radius:12px;padding:10px;text-align:center;cursor:pointer;position:relative;}
.shop-item.selected{border-color:var(--primary);box-shadow:0 0 10px var(--primary);}
.rarity{width:8px;height:8px;border-radius:50%;position:absolute;top:5px;right:5px;}
canvas{display:block;background:#000;}
#joystick{position:absolute;bottom:50px;left:50px;width:100px;height:100px;background:rgba(255,192,203,0.5);border-radius:50%;touch-action:none;display:none;}
#stick{position:absolute;top:40px;left:40px;width:20px;height:20px;background:var(--primary);border-radius:50%;}
</style>
</head>
<body>

<div id="ui-container">
  <div id="screen-auth" class="active">
    <h1>Pnake 🐍</h1>
    <input type="text" id="auth-user" placeholder="Логин">
    <input type="password" id="auth-pass" placeholder="Пароль">
    <button onclick="app.auth()">Войти / Создать</button>
  </div>

  <div id="screen-menu">
    <div class="settings-top">
      <button onclick="app.toggleTheme()">🌓</button>
      <button onclick="app.toggleMusic()">🎵</button>
      <button onclick="app.toggleControl()">🎮</button>
    </div>
    <h2>Привет, <span id="user-name"></span>!</h2>
    <p>💎 Кристаллы: <span id="user-gems">0</span></p>
    <button onclick="app.showScreen('screen-modes')">ИГРАТЬ</button>
    <button onclick="app.showScreen('screen-shop')">МАГАЗИН</button>
  </div>

  <div id="screen-modes">
    <div class="back-arrow" onclick="app.showScreen('screen-menu')">←</div>
    <h2>Выбери режим</h2>
    <button onclick="app.startGame('classic')">Классика 💀</button>
    <button onclick="app.startGame('portal')">Портал 🌀</button>
    <button onclick="app.startGame('ghost')">Призрак 👻</button>
  </div>

  <div id="screen-shop">
    <div class="back-arrow" onclick="app.showScreen('screen-menu')">←</div>
    <h2>Магазин</h2>
    <div id="shop-content" style="overflow-y:auto;width:100%;">
      <p>Цвета</p><div id="shop-colors" class="grid"></div>
      <p>Глазки</p><div id="shop-faces" class="grid"></div>
      <p>Еда</p><div id="shop-food" class="grid"></div>
    </div>
  </div>
</div>

<div class="stat-bar" id="game-stats" style="display:none">
  🍎 <span id="cur-score">0</span> | 💎 <span id="cur-gems">0</span> | Рекорд: <span id="cur-hi">0</span>
</div>

<canvas id="gameCanvas"></canvas>
<div id="joystick"><div id="stick"></div></div>

<script>
// --- Аудио ---
const audio={ctx:new(window.AudioContext||window.webkitAudioContext)(),enabled:true,play(f,t='sine',d=0.1){if(!this.enabled)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t;o.frequency.setValueAtTime(f,this.ctx.currentTime);g.gain.setValueAtTime(0.1,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+d);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+d);},eat(){this.play(600,'square');},click(){this.play(400,'sine',0.05);},fail(){this.play(150,'sawtooth',0.5);}};

// --- App ---
const app={
user:null,currentMode:'classic',theme:'light',control:'swipe',
shop:{
colors:[{id:'pink',val:'#FF69B4',p:0,r:'basic'},{id:'blue',val:'#87CEEB',p:40,r:'rare'},{id:'mint',val:'#98FF98',p:40,r:'rare'},{id:'lavender',val:'#E6E6FA',p:80,r:'epic'},{id:'gold',val:'#FFD700',p:240,r:'legendary'}],
faces:[{id:'dot',val:'●●',p:0,r:'basic'},{id:'happy',val:'^^',p:40,r:'rare'},{id:'kawaii',val:'◕◕',p:100,r:'epic'},{id:'cool',val:'🕶',p:300,r:'legendary'}],
food:[{id:'apple',val:'🍎',p:0,r:'basic'},{id:'cherry',val:'🍒',p:20,r:'rare'},{id:'strawberry',val:'🍓',p:40,r:'rare'},{id:'peach',val:'🍑',p:50,r:'epic'},{id:'pizza',val:'🍕',p:100,r:'epic'},{id:'burger',val:'🍔',p:150,r:'legendary'},{id:'fries',val:'🍟',p:200,r:'legendary'},{id:'kebab',val:'🍢',p:240,r:'legendary'}]
},
auth(){let n=document.getElementById('auth-user').value,p=document.getElementById('auth-pass').value;if(!n||!p)return alert("Введи данные!");let s=JSON.parse(localStorage.getItem('pnake_user_'+n));if(s){if(s.pass!==p)return alert("Неверный пароль!");this.user=s;}else{this.user={name:n,pass:p,gems:0,inv:['pink','dot','apple'],setup:{c:'pink',f:'dot',fo:'apple'},hi:{classic:0,portal:0,ghost:0}};}this.save();this.showScreen('screen-menu');audio.click();},
save(){localStorage.setItem('pnake_user_'+this.user.name,JSON.stringify(this.user));document.getElementById('user-name').innerText=this.user.name;document.getElementById('user-gems').innerText=this.user.gems;},
showScreen(id){document.querySelectorAll('#ui-container>div').forEach(d=>d.classList.remove('active'));if(id!=='none')document.getElementById(id).classList.add('active');if(id==='screen-shop')this.renderShop();audio.click();},
toggleTheme(){this.theme=this.theme==='light'?'dark':'light';document.body.classList.toggle('dark-mode');audio.click();},
toggleMusic(){audio.enabled=!audio.enabled;audio.click();},
toggleControl(){this.control=this.control==='swipe'?'joystick':'swipe';document.getElementById('joystick').style.display=this.control==='joystick'?'block':'none';audio.click();},
renderShop(){const drawGrid=(cid,items,sk)=>{const c=document.getElementById(cid);c.innerHTML='';items.forEach(i=>{const owned=this.user.inv.includes(i.id);const sel=this.user.setup[sk]===i.id;const div=document.createElement('div');div.className=`shop-item ${sel?'selected':''}`;div.innerHTML=`<div class="rarity" style="background:${this.getRarity(i.r)}"></div><div style="font-size:20px">${i.val.length>7?'🎨':i.val}</div><div style="font-size:10px">${owned?(sel?'✓':'ВЗЯТЬ'):'💎'+i.p}</div>`;div.onclick=()=>{if(owned){this.user.setup[sk]=i.id;}else if(this.user.gems>=i.p){this.user.gems-=i.p;this.user.inv.push(i.id);this.user.setup[sk]=i.id;}this.save();this.renderShop();audio.click();};c.appendChild(div);});};drawGrid('shop-colors',this.shop.colors,'c');drawGrid('shop-faces',this.shop.faces,'f');drawGrid('shop-food',this.shop.food,'fo');},
getRarity(r){return{basic:'#A0A0A0',rare:'#00BFFF',epic:'#9370DB',legendary:'#FFD700'}[r];},
startGame(m){this.currentMode=m;this.showScreen('none');document.getElementById('game-stats').style.display='block';game.init();}
};

// --- Game ---
const game={
canvas:document.getElementById('gameCanvas'),ctx:document.getElementById('gameCanvas').getContext('2d'),
grid:20,snake:[],dir:{x:0,y:0},food:{},score:0,wallColor:'#000',bgColor:'#000',running:false,
init(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight;this.tileX=Math.floor(this.canvas.width/this.grid);this.tileY=Math.floor(this.canvas.height/this.grid);this.snake=[{x:10,y:10}];this.dir={x:0,y:0};this.score=0;this.wallColor='#000';this.bgColor='#000';this.spawnFood();document.getElementById('cur-hi').innerText=app.user.hi[app.currentMode];if(!this.running){this.running=true;this.loop();}},
spawnFood(){this.food={x:Math.floor(Math.random()*this.tileX),y:Math.floor(Math.random()*this.tileY)};},
update(){if(this.dir.x===0&&this.dir.y===0)return;const head={x:this.snake[0].x+this.dir.x,y:this.snake[0].y+this.dir.y};if(app.currentMode==='classic'||app.currentMode==='ghost'){if(head.x<0||head.x>=this.tileX||head.y<0||head.y>=this.tileY)return this.over();}else{if(head.x<0)head.x=this.tileX-1;if(head.x>=this.tileX)head.x=0;if(head.y<0)head.y=this.tileY-1;if(head.y>=this.tileY)head.y=0;}if(app.currentMode!=='ghost'){for(let p of this.snake)if(p.x===head.x&&p.y===head.y)return this.over();}this.snake.unshift(head);if(head.x===this.food.x&&head.y===this.food.y){this.score++;app.user.gems+=2;audio.eat();this.spawnFood();if(this.score%10===0){this.wallColor=`hsl(${Math.random()*360},70%,50%)`;this.bgColor=`hsl(${Math.random()*360},20%,10%)`;}}else{this.snake.pop();}document.getElementById('cur-score').innerText=this.score;document.getElementById('cur-gems').innerText=app.user.gems;},
draw(){this.ctx.fillStyle=this.bgColor;this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);this.ctx.strokeStyle=this.wallColor;this.ctx.lineWidth=5;this.ctx.strokeRect(0,0,this.canvas.width,this.canvas.height);const f=app.shop.food.find(i=>i.id===app.user.setup.fo);this.ctx.font="18px Arial";this.ctx.fillText(f.val,this.food.x*this.grid,this.food.y*this.grid+15);const sColor=app.shop.colors.find(i=>i.id===app.user.setup.c).val;this.snake.forEach((p,i)=>{this.ctx.fillStyle=sColor;this.ctx.beginPath();this.ctx.roundRect(p.x*this.grid,p.y*this.grid,this.grid-1,this.grid-1,i===0?8:4);this.ctx.fill();if(i===0)this.drawFace(p.x*this.grid,p.y*this.grid);});},
drawFace(x,y){const f=app.shop.faces.find(i=>i.id===app.user.setup.f);this.ctx.fillStyle='#000';this.ctx.font='bold 10px Arial';this.ctx.fillText(f.val,x+2,y+12);},
over(){audio.fail();if(this.score>app.user.hi[app.currentMode])app.user.hi[app.currentMode]=this.score;app.save();alert(`Игра окончена! Счет: ${this.score}`);document.getElementById('game-stats').style.display='none';app.showScreen('screen-menu');this.dir={x:0,y:0};},
loop(){if(this.running){this.update();this.draw();setTimeout(()=>requestAnimationFrame(()=>this.loop()),150);}}
};

// --- Управление ---
let tsX,tsY;
window.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&game.dir.y===0)game.dir={x:0,y:-1};if(e.key==='ArrowDown'&&game.dir.y===0)game.dir={x:0,y:1};if(e.key==='ArrowLeft'&&game.dir.x===0)game.dir={x:-1,y:0};if(e.key==='ArrowRight'&&game.dir.x===0)game.dir={x:1,y:0};});

window.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;});
window.addEventListener('touchend',e=>{if(app.control==='swipe'){const dx=e.changedTouches[0].clientX-tsX,dy=e.changedTouches[0].clientY-tsY;if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&game.dir.x===0)game.dir={x:1,y:0};else if(dx<0&&game.dir.x===0)game.dir={x:-1,y:0};}else{if(dy>0&&game.dir.y===0)game.dir={x:0,y:1};else if(dy<0&&game.dir.y===0)game.dir={x:0,y:-1};}}});

// --- Джойстик ---
const stick=document.getElementById('stick');let drag=false,origin={x:0,y:0};
stick.addEventListener('touchstart',e=>{drag=true;origin={x:e.touches[0].clientX,y:e.touches[0].clientY};});
stick.addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();const dx=e.touches[0].clientX-origin.x,dy=e.touches[0].clientY-origin.y;const limit=40;const nx=Math.max(-limit,Math.min(limit,dx));const ny=Math.max(-limit,Math.min(limit,dy));stick.style.transform=`translate(${nx}px,${ny}px)`;if(Math.abs(nx)>Math.abs(ny)){game.dir={x:nx>0?1:-1,y:0};}else{game.dir={x:0,y:ny>0?1:-1};}});
stick.addEventListener('touchend',e=>{drag=false;stick.style.transform='translate(0,0)';});
</script>
</body>
</html>
